/* COMPETITOR ANALYSIS, ONE PAGE
   The question this tab answers: which pages outrank THIS page for its
   keywords, and what would it take to beat them. Whole-site comparisons
   (authority, total traffic) belong to Competitive Research, so every figure
   here describes one competing page, never a whole domain.

   SAMPLE DATA. Competitor figures come from a seeded hash of domain + page,
   so they are stable between reloads, follow whichever page is selected, and
   any domain typed into the add box gets believable numbers of its own. */
const OUR_DOMAIN = "example.com";
const COMP_POOL = {
  "instantly.ai":   { auth: 74 },
  "apollo.io":      { auth: 86 },
  "lemwarm.com":    { auth: 62 },
  "warmy.io":       { auth: 58 },
  "mailreach.co":   { auth: 54 },
  "trulyinbox.com": { auth: 41 } };
const GAP_TOPICS = {
  article: ["Step-by-step walkthrough", "Day-by-day warmup schedule", "Comparison table of tools", "FAQ section", "Screenshots of each step",
    "SPF, DKIM and DMARC checklist", "Common mistakes to avoid", "Real results with numbers", "How to measure inbox placement", "Glossary of terms"],
  product: ["Pricing comparison table", "Customer reviews and logos", "Free trial details", "Full integration list", "Deliverability results with numbers",
    "Security and compliance", "FAQ section", "Migration guide", "Feature comparison vs alternatives", "Onboarding walkthrough video"] };
const GAP_KEYWORDS = {
  article: ["email warmup best practices", "how to warm up a new domain", "email deliverability checklist", "why are my emails going to spam",
    "gmail bulk sender requirements", "inbox placement test", "sender reputation score", "cold email deliverability", "warmup emails per day", "spf dkim dmarc setup"],
  product: ["best email warmup tool", "email warmup software", "automated email warmup", "email deliverability tool", "warmup inbox service",
    "email warmup for agencies", "cold email warmup tool", "email warmup api", "free email warmup", "email warmup review"] };
/* Competitor slots draw from the validated categorical order, in order, and a
   competitor keeps its slot for as long as it is on the list: removing one
   never repaints the others. You are always the brand green. Every series
   also carries its own dash, so identity never rests on colour alone. */
const COMP_FAMILIES = ["impressions", "ai", "rankings", "engagement"];
const COMP_DASH = { traffic: null, impressions: "7 3", ai: "2 3", rankings: "11 4", engagement: "7 3 2 3" };
const MAX_COMPETITORS = 4;
const VOL_STEPS = [90, 140, 210, 320, 480, 720, 1000, 1600, 2400, 3600, 5400];

const hashStr = (str) => {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};
/* mulberry32 on the hash: one stable number in [0, 1) per key. */
const seeded = (key) => {
  let a = (hashStr(key) + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const pageKind = (url) => (url.startsWith("/blog") || url.startsWith("/en/articles") || url.startsWith("/free-tools") ? "article" : "product");
const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const cleanDomain = (raw) => raw.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").split(/[/?#\s]/)[0];
/* The keywords a page competes on: its own keyword list minus brand searches,
   which no competitor ranks for. */
const pageTargets = (url) => {
  const rows = PAGE_KEYWORDS[url] || [];
  const market = rows.filter((k) => k.intent !== "Nav.");
  const pick = (market.length ? market : rows).slice(0, 3);
  return pick.length ? pick : [{ kw: (url.split("/").pop() || "email warmup").replace(/-/g, " "), vol: 90 }];
};
const agoLabel = (days) => (days < 45 ? `${days}d ago` : `${Math.round(days / 30)}mo ago`);

/* Your page. Traffic, keywords and links come from the report's own data so
   this tab and the Overview tab agree. */
function ourPage(url, pageDetail) {
  const sp = SITE_PAGES.find((p) => p.url === url);
  const r = (k) => seeded(`${OUR_DOMAIN}|${url}|${k}`);
  const base = sp && sp.pos != null ? sp.pos : 12;
  return {
    domain: OUR_DOMAIN, path: url, you: true, fam: "traffic",
    pos: pageTargets(url).map((_, i) => {
      const p = Math.max(1, Math.round(base + [0, 6, 3][i % 3] + r("p" + i) * 2));
      return p > 100 ? null : p;
    }),
    traffic: pageDetail.organicTraffic,
    kws: pageDetail.organicKeywords,
    rd: pageDetail.refDomains,
    cites: pageDetail.cites,
    words: pageDetail.words,
    updated: pageDetail.updated,
    lcp: pageDetail.lcp,
    faq: pageDetail.faq };
}

/* A competitor's page for the same topic. Its traffic comes from where it
   ranks for the page's keywords, the rest scales off yours by the strength of
   its site: stronger sites rank higher and earn more links, not always. */
const CTR_AT = [0.28, 0.15, 0.1, 0.07, 0.05, 0.04, 0.03, 0.025, 0.02, 0.018];
const ctrAt = (p) => (p == null ? 0 : p <= 10 ? CTR_AT[p - 1] : p <= 20 ? 0.01 : 0.002);
function theirPage(domain, url, ours, fam) {
  const auth = COMP_POOL[domain] ? COMP_POOL[domain].auth : 30 + (hashStr(domain) % 45);
  const s = auth / 60;
  const r = (k) => seeded(`${domain}|${url}|${k}`);
  const kind = pageKind(url);
  const targets = pageTargets(url);
  const pos = targets.map((_, i) => (r("q" + i) < 0.12 ? null : Math.max(1, Math.round(1 + r("p" + i) * 16 * (1.5 - auth / 100)))));
  return {
    domain, fam, you: false,
    path: kind === "article" ? `/blog/${slugify(targets[0].kw)}` : url.includes("alternative") ? `/blog/${slugify(targets[0].kw)}s` : url,
    pos,
    traffic: Math.round(targets.reduce((a, t, i) => a + t.vol * ctrAt(pos[i]), 0) * (1.2 + r("t") * 1.6)),
    kws: Math.max(3, Math.round(Math.max(ours.kws, 6) * (0.45 + r("k") * 1.7) * s)),
    rd: Math.max(1, Math.round(Math.max(ours.rd, 3) * (0.4 + r("rd") * 2.6) * s)),
    cites: Math.round(Math.max(ours.cites, 12) * (0.2 + r("ai") * 1.5)),
    words: Math.round(1100 + r("w") * 2700),
    updated: Math.round(4 + r("u") * 200),
    lcp: +(1.3 + r("lcp") * 2.4).toFixed(1),
    faq: r("faq") > 0.4 };
}

/* The competitors worth comparing by default are the ones that outrank you
   for the page's main keyword. */
function defaultCompetitors(url, ours) {
  const ranked = Object.keys(COMP_POOL)
    .map((d) => ({ d, pos: theirPage(d, url, ours).pos[0] }))
    .sort((a, b) => (a.pos ?? 999) - (b.pos ?? 999));
  const above = ranked.filter((x) => x.pos != null && (ours.pos[0] == null || x.pos < ours.pos[0]));
  return (above.length >= 3 ? above : ranked).slice(0, 3).map((x, i) => ({ domain: x.d, fam: COMP_FAMILIES[i] }));
}

/* Colour swatch plus its dash, the same pairing the chart uses. */
function SeriesKey({ color, dash }) {
  return (
    <svg width="18" height="8" aria-hidden="true" style={{ flexShrink: 0 }}>
      <line x1="1" y1="4" x2="17" y2="4" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeDasharray={dash || undefined} />
    </svg>
  );
}

function CompetitorSection({ selectedPage, pageDetail, PageDropdown }) {
  const { T, toast, go } = useT();
  const ours = useMemo(() => ourPage(selectedPage, pageDetail), [selectedPage, pageDetail]);
  const [comps, setComps] = useState(() => defaultCompetitors(selectedPage, ours));
  const [kwi, setKwi] = useState(0);
  const [draft, setDraft] = useState("");
  const [note, setNote] = useState("");
  const [hidden, setHidden] = useState([]);
  const [oppTab, setOppTab] = useState("missing");
  const [queued, setQueued] = useState([]);

  /* A different page is a different set of rivals. */
  useEffect(() => {
    setComps(defaultCompetitors(selectedPage, ours));
    setKwi(0); setHidden([]); setQueued([]); setNote("");
  }, [selectedPage]);

  const targets = pageTargets(selectedPage);
  const kw = targets[Math.min(kwi, targets.length - 1)];
  const theirs = useMemo(() => comps.map((c) => theirPage(c.domain, selectedPage, ours, c.fam)), [comps, selectedPage, ours]);
  const all = [ours, ...theirs];
  const colorOf = (e) => cat(e.fam, T);

  /* ── add / remove ── */
  const add = (raw) => {
    const d = cleanDomain(raw);
    if (!d || !d.includes(".")) { setNote("Enter a domain like competitor.com or a full page URL."); return; }
    if (d === OUR_DOMAIN) { setNote("That's your own site."); return; }
    if (comps.some((c) => c.domain === d)) { setNote(`${d} is already in the comparison.`); return; }
    if (comps.length >= MAX_COMPETITORS) { setNote(`Up to ${MAX_COMPETITORS} competitors. Remove one to add another.`); return; }
    const used = comps.map((c) => c.fam);
    setComps([...comps, { domain: d, fam: COMP_FAMILIES.find((f) => !used.includes(f)) }]);
    setDraft(""); setNote("");
  };
  const remove = (d) => { setComps(comps.filter((c) => c.domain !== d)); setHidden(hidden.filter((h) => h !== d)); setNote(""); };
  const suggestions = Object.keys(COMP_POOL)
    .filter((d) => !comps.some((c) => c.domain === d))
    .map((d) => ({ d, pos: theirPage(d, selectedPage, ours).pos[kwi] }))
    .filter((x) => x.pos != null)
    .sort((a, b) => a.pos - b.pos)
    .slice(0, 3);

  /* ── head-to-head ── */
  const byPos = [...all].sort((a, b) => (a.pos[kwi] ?? 999) - (b.pos[kwi] ?? 999));
  const COLS = [
    { id: "pos", label: "Position", better: "low", get: (e) => e.pos[kwi], fmt: (v) => (v == null ? "Not in top 100" : `#${v}`) },
    { id: "traffic", label: "Est. traffic", better: "high", fmt: (v) => v.toLocaleString() },
    { id: "kws", label: "Keywords", better: "high", fmt: (v) => v.toLocaleString() },
    { id: "words", label: "Words", better: "high", fmt: (v) => v.toLocaleString() },
    { id: "rd", label: "Ref. domains", better: "high", fmt: (v) => v.toLocaleString() },
    { id: "cites", label: "AI citations", better: "high", fmt: (v) => v.toLocaleString() },
    { id: "updated", label: "Updated", better: "low", fmt: agoLabel },
    { id: "lcp", label: "Load time", better: "low", fmt: (v) => `${v.toFixed(1)}s` },
    { id: "faq", label: "FAQ schema", better: "yes", fmt: (v) => (v ? "Yes" : "No") },
  ];
  const val = (col, e) => (col.get ? col.get(e) : e[col.id]);
  const bestOf = (col) => {
    const vals = all.map((e) => val(col, e)).filter((v) => v != null);
    if (col.better === "yes") return vals.includes(true) && vals.includes(false) ? true : undefined;
    if (vals.length < 2) return undefined;
    return col.better === "low" ? Math.min(...vals) : Math.max(...vals);
  };

  /* The verdict: who is ahead on this keyword and the clearest reasons why. */
  const leader = theirs.filter((c) => c.pos[kwi] != null).sort((a, b) => a.pos[kwi] - b.pos[kwi])[0];
  const ourPos = ours.pos[kwi];
  let verdict;
  if (!leader) verdict = <>None of these competitors rank in the top 100 for “{kw.kw}”. {ourPos ? <>You rank <strong>#{ourPos}</strong>.</> : null}</>;
  else if (ourPos != null && ourPos < leader.pos[kwi]) verdict = <>You rank <strong>#{ourPos}</strong> for “{kw.kw}”, ahead of every page here. The closest is {leader.domain} at #{leader.pos[kwi]}.</>;
  else {
    const why = [];
    if (leader.words > ours.words * 1.2) why.push(`${(leader.words - ours.words).toLocaleString()} more words`);
    if (leader.rd > ours.rd * 1.3) why.push(`${(leader.rd / ours.rd).toFixed(1)}× your referring domains`);
    if (leader.faq && !ours.faq) why.push("FAQ schema you don't have");
    if (leader.updated < ours.updated - 30) why.push(`fresher content (updated ${agoLabel(leader.updated)}, yours ${agoLabel(ours.updated)})`);
    verdict = (
      <>
        <strong>{leader.domain}</strong> ranks <strong>#{leader.pos[kwi]}</strong> for “{kw.kw}”; you rank {ourPos == null ? <strong>outside the top 100</strong> : <strong>#{ourPos}</strong>}.{" "}
        {why.length
          ? <>Its page has {why.length > 1 ? why.slice(0, -1).join(", ") + " and " + why[why.length - 1] : why[0]}.</>
          : <>The pages are close on content and links, so the gap is mostly the strength of its site.</>}
      </>
    );
  }

  /* ── traffic trend, last 12 months ── */
  const months = useMemo(() => Array.from({ length: 12 }, (_, i) => {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - (11 - i), 1);
    return `${MONTH_ABBR[d.getMonth()]} ’${String(d.getFullYear()).slice(2)}`;
  }), []);
  const trend = useMemo(() => months.map((m, i) => {
    const row = { d: m };
    all.forEach((e) => {
      const r = (k) => seeded(`${e.domain}|${selectedPage}|trend|${k}`);
      const start = e.traffic * (0.45 + r("s") * 0.6);
      const t = i / 11;
      const v = start + (e.traffic - start) * Math.pow(t, 0.8 + r("c") * 1.4);
      row[e.domain] = Math.round(v * (i === 11 ? 1 : 1 + (r("w" + i) - 0.5) * 0.14));
    });
    return row;
  }), [months, all.map((e) => e.domain).join(","), selectedPage]);
  const shareTotal = all.reduce((a, e) => a + e.traffic, 0) || 1;

  /* ── gaps and keyword opportunities, against the current set ── */
  const kind = pageKind(selectedPage);
  const gaps = theirs.length === 0 ? [] : GAP_TOPICS[kind].map((topic) => {
    const by = theirs.filter((c) => seeded(`${c.domain}|${selectedPage}|topic|${topic}`) < 0.62);
    const o = seeded(`${OUR_DOMAIN}|${selectedPage}|topic|${topic}`);
    const mine = o < 0.45 ? 0 : o < 0.72 ? Math.round(60 + o * 200) : null;
    const avg = by.length ? Math.round(by.reduce((a, c) => a + 250 + seeded(`${c.domain}|${selectedPage}|tw|${topic}`) * 650, 0) / by.length) : 0;
    return { topic, by, mine, avg };
  }).filter((g) => g.mine !== null && g.by.length >= Math.max(1, Math.ceil(theirs.length / 2)))
    .sort((a, b) => b.by.length - a.by.length || a.mine - b.mine)
    .slice(0, 6);

  const opps = GAP_KEYWORDS[kind].map((k) => {
    const r = (x) => seeded(`${selectedPage}|kw|${k}|${x}`);
    const vol = VOL_STEPS[Math.floor(r("v") * VOL_STEPS.length)];
    const mine = r("mine") < 0.5 ? null : Math.round(9 + r("mp") * 50);
    const ranks = theirs.map((c) => {
      const cr = (x) => seeded(`${c.domain}|${selectedPage}|kw|${k}|${x}`);
      const auth = COMP_POOL[c.domain] ? COMP_POOL[c.domain].auth : 30 + (hashStr(c.domain) % 45);
      return { c, pos: cr("in") < 0.35 ? null : Math.max(1, Math.round(1 + cr("p") * 28 * (1.4 - auth / 100))) };
    }).filter((x) => x.pos != null).sort((a, b) => a.pos - b.pos);
    return { k, vol, mine, best: ranks[0] };
  });
  const missing = opps.filter((o) => o.mine == null && o.best && o.best.pos <= 20).sort((a, b) => b.vol - a.vol);
  const weak = opps.filter((o) => o.mine != null && o.best && o.best.pos <= o.mine - 3).sort((a, b) => b.vol - a.vol);
  const oppRows = (oppTab === "missing" ? missing : weak).slice(0, 8);

  const queue = (key, what) => {
    if (queued.includes(key)) return;
    setQueued([...queued, key]);
    toast(`${what} added to the content update for ${selectedPage}`, "check");
  };

  const th = { textAlign: "left", padding: "0 12px 10px", color: T.txtSoft, fontWeight: FW.medium, fontSize: FS.micro, letterSpacing: 1.2, textTransform: "uppercase", whiteSpace: "nowrap" };
  const chip = { display: "inline-flex", alignItems: "center", gap: 8, height: 32, padding: "0 6px 0 11px", borderRadius: R.pill,
    border: `1px solid ${T.innerBorder}`, background: T.innerCard, fontSize: FS.small, color: T.txt, fontWeight: FW.medium };

  return (
    <div>
      <PageDropdown />

      {/* ── WHO TO COMPARE ── */}
      <Glass style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
          <Lbl color={T.primary}>Compare this page with</Lbl>
          <span style={{ fontSize: FS.small, color: T.txtSoft, ...NUM }}>{comps.length} of {MAX_COMPETITORS} competitors</span>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {all.map((e) => (
            <span key={e.domain} style={{ ...chip, paddingRight: e.you ? 12 : 6 }}>
              <span aria-hidden="true" style={{ width: 10, height: 10, borderRadius: 3, background: colorOf(e), flexShrink: 0 }} />
              {e.domain}
              {e.you
                ? <span style={{ fontSize: FS.micro, color: T.txtSoft }}>You</span>
                : <button type="button" onClick={() => remove(e.domain)} aria-label={`Remove ${e.domain}`} title={`Remove ${e.domain}`}
                    style={{ width: 22, height: 22, borderRadius: "50%", border: 0, background: "transparent", color: T.txtSoft, cursor: "pointer",
                      display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0 }}><Ico n="x" size={12} sw={2} /></button>}
            </span>
          ))}
        </div>
        <form onSubmit={(ev) => { ev.preventDefault(); add(draft); }} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <div style={{ flex: "1 1 260px", maxWidth: 420 }}>
            <Field value={draft} onChange={(v) => { setDraft(v); setNote(""); }} placeholder="Add a competitor: domain.com or a page URL" ariaLabel="Competitor domain or page URL" />
          </div>
          <Btn type="submit" primary icon="plus" disabled={comps.length >= MAX_COMPETITORS}>Add competitor</Btn>
          {note && <span role="status" style={{ fontSize: FS.small, color: T.warn }}>{note}</span>}
        </form>
        {suggestions.length > 0 && comps.length < MAX_COMPETITORS && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
            <span style={{ fontSize: FS.small, color: T.txtSoft }}>Also ranking for “{kw.kw}”:</span>
            {suggestions.map((s) => (
              <button key={s.d} type="button" onClick={() => add(s.d)} style={{ ...chip, cursor: "pointer", paddingRight: 11, fontFamily: "inherit" }}>
                <Ico n="plus" size={12} sw={2} />{s.d}<span style={{ color: T.txtSoft, ...NUM }}>#{s.pos}</span>
              </button>
            ))}
          </div>
        )}
      </Glass>

      {/* ── HEAD-TO-HEAD ── */}
      <Glass style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
          <div>
            <Lbl color={T.primary}>Head-to-head</Lbl>
            <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: -6 }}>Ranked by position for the keyword you pick. The best figure in each column is highlighted.</div>
          </div>
          {targets.length > 1 && (
            <Segmented ariaLabel="Keyword" value={String(kwi)} onChange={(v) => setKwi(Number(v))}
              options={targets.map((t, i) => ({ value: String(i), label: t.kw }))} />
          )}
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: T.innerCard, border: `1px solid ${T.innerBorder}`, borderRadius: R.md, padding: "12px 14px", marginBottom: 14 }}>
          <span style={{ color: T.primary, display: "flex", marginTop: 2 }}><Ico n="spark" size={15} sw={1.8} /></span>
          <div style={{ fontSize: FS.body, color: T.txtMid, lineHeight: 1.6 }}>
            {verdict}
            <span style={{ display: "block", fontSize: FS.small, color: T.txtSoft, marginTop: 2, ...NUM }}>“{kw.kw}” · {kw.vol.toLocaleString()} searches a month</span>
          </div>
        </div>
        <div className="tbl-scroll">
          <table style={{ width: "100%", minWidth: 1040, borderCollapse: "collapse", fontSize: FS.body }}>
            <caption style={{ position: "absolute", clip: "rect(0 0 0 0)", height: 0, overflow: "hidden" }}>Your page against competing pages for {kw.kw}</caption>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.rowBorder}` }}>
                <th scope="col" style={th}>Page</th>
                {COLS.map((c) => <th key={c.id} scope="col" style={th}>{c.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {byPos.map((e) => (
                <tr key={e.domain} style={{ borderBottom: `1px solid ${T.rowBorder}`, background: e.you ? mixHex(T.primary, T.surface, 0.05) : "transparent" }}>
                  <th scope="row" style={{ textAlign: "left", padding: "11px 12px", fontWeight: FW.normal, maxWidth: 260 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <SeriesKey color={colorOf(e)} dash={COMP_DASH[e.fam]} />
                      <span style={{ minWidth: 0 }}>
                        <span style={{ display: "flex", alignItems: "center", gap: 6, color: T.txt, fontWeight: FW.bold }}>{e.domain}{e.you && <Tag color={T.primary}>You</Tag>}</span>
                        <span style={{ display: "block", fontSize: FS.micro, color: T.txtSoft, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.path}</span>
                      </span>
                    </span>
                  </th>
                  {COLS.map((c) => {
                    const v = val(c, e);
                    const best = bestOf(c);
                    const win = best !== undefined && v === best;
                    return (
                      <td key={c.id} title={win ? "Best in this comparison" : undefined} style={{
                        padding: "11px 12px", whiteSpace: "nowrap", ...NUM,
                        color: v == null ? T.txtSoft : T.txt, fontWeight: win ? FW.bold : FW.normal,
                        background: win ? mixHex(T.primary, T.surface, 0.13) : "transparent" }}>{c.fmt(v)}</td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Glass>

      {/* ── TRAFFIC OVER TIME + SHARE ── */}
      <div className="split-16" style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 14, marginBottom: 14 }}>
        <Glass>
          <Lbl color={T.primary}>Organic traffic, last 12 months</Lbl>
          <div role="group" aria-label="Series to show" style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            {all.map((e) => {
              const on = !hidden.includes(e.domain);
              return (
                <button key={e.domain} type="button" aria-pressed={on}
                  onClick={() => setHidden(on ? [...hidden, e.domain] : hidden.filter((h) => h !== e.domain))}
                  style={{ ...chip, height: 28, paddingRight: 10, cursor: "pointer", fontFamily: "inherit", opacity: on ? 1 : 0.5 }}>
                  <SeriesKey color={colorOf(e)} dash={COMP_DASH[e.fam]} />{e.domain}
                </button>
              );
            })}
          </div>
          <div style={{ height: 250 }} role="img" aria-label={`Monthly organic traffic for ${all.map((e) => e.domain).join(", ")}`}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={trend} margin={{ top: 8, right: 22, bottom: 0, left: -8 }}>
                <CartesianGrid vertical={false} stroke={T.chartGrid} />
                <XAxis dataKey="d" tick={{ fontSize: 11, fill: T.txtSoft }} axisLine={false} tickLine={false} minTickGap={24} />
                <YAxis tick={{ fontSize: 11, fill: T.txtSoft }} axisLine={false} tickLine={false} width={52}
                  tickFormatter={(v) => (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "K" : v)} />
                <RTooltip content={<ChartTip />} cursor={{ stroke: T.txtSoft, strokeWidth: 1 }} />
                {all.filter((e) => !hidden.includes(e.domain)).map((e) => (
                  <Line key={e.domain} dataKey={e.domain} name={e.domain} type="monotone" stroke={colorOf(e)}
                    strokeWidth={e.you ? 2.6 : 2} strokeDasharray={COMP_DASH[e.fam] || undefined} dot={false}
                    activeDot={{ r: 4, strokeWidth: 2, stroke: T.surface }} />
                ))}
              </LineChart>
            </ResponsiveContainer>
          </div>
        </Glass>

        <Glass>
          <Lbl color={T.primary}>Share of traffic</Lbl>
          <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: -6, marginBottom: 14 }}>Of the monthly organic traffic these pages earn together.</div>
          {[...all].sort((a, b) => b.traffic - a.traffic).map((e) => {
            const pct = (e.traffic / shareTotal) * 100;
            return (
              <div key={e.domain} style={{ marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 6 }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: FS.small, color: T.txt, fontWeight: e.you ? FW.bold : FW.medium, minWidth: 0 }}>
                    <span aria-hidden="true" style={{ width: 10, height: 10, borderRadius: 3, background: colorOf(e), flexShrink: 0 }} />
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.domain}</span>
                  </span>
                  <span style={{ fontSize: FS.small, color: T.txtMid, whiteSpace: "nowrap", ...NUM }}>
                    {e.traffic.toLocaleString()} <strong style={{ color: T.txt, marginLeft: 6 }}>{pct.toFixed(1)}%</strong>
                  </span>
                </div>
                <Bar val={pct} max={100} height={6} grad={colorOf(e)} />
              </div>
            );
          })}
        </Glass>
      </div>

      {/* ── WHAT TO DO ABOUT IT ── */}
      <div className="split-16" style={{ display: "grid", gridTemplateColumns: "1fr 1.25fr", gap: 14 }}>
        <Glass>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
            <div>
              <Lbl color={T.primary}>What they cover that you don't</Lbl>
              <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: -6, marginBottom: 12 }}>Sections on most competing pages that yours is missing or only touches.</div>
            </div>
            <Btn icon="arrowR" onClick={() => go("actions", "content-update")} style={{ fontSize: FS.small }}>Open Actions Hub</Btn>
          </div>
          {gaps.length === 0 && (
            <div style={{ padding: "22px 0", textAlign: "center", fontSize: FS.small, color: T.txtSoft }}>
              {theirs.length === 0 ? "Add a competitor to find the sections your page is missing." : "Your page already covers what these competitors cover."}
            </div>
          )}
          {gaps.map((g) => {
            const key = "gap:" + g.topic;
            const done = queued.includes(key);
            return (
              <div key={g.topic} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, padding: "11px 0", borderTop: `1px solid ${T.rowBorder}` }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: FS.body, color: T.txt, fontWeight: FW.bold }}>{g.topic}</div>
                  <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: 3, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", ...NUM }}>
                    <span style={{ display: "inline-flex", gap: 3 }} aria-label={`Covered by ${g.by.map((c) => c.domain).join(", ")}`}>
                      {g.by.map((c) => <span key={c.domain} title={c.domain} style={{ width: 8, height: 8, borderRadius: 2, background: colorOf(c) }} />)}
                    </span>
                    On {g.by.length} of {theirs.length} pages, about {g.avg.toLocaleString()} words · You: {g.mine === 0 ? <span style={{ color: T.bad }}>missing</span> : `${g.mine} words`}
                  </div>
                </div>
                <Btn icon={done ? "check" : "plus"} disabled={done} onClick={() => queue(key, `“${g.topic}”`)} style={{ fontSize: FS.small, flexShrink: 0 }}>
                  {done ? "Queued" : "Add to update"}
                </Btn>
              </div>
            );
          })}
        </Glass>

        <Glass>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            <div>
              <Lbl color={T.primary}>Keyword opportunities</Lbl>
              <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: -6 }}>
                {oppTab === "missing" ? "Keywords a competitor ranks for in the top 20 and this page doesn't rank for." : "Keywords where a competitor ranks at least 3 places above this page."}
              </div>
            </div>
            <Segmented ariaLabel="Opportunity type" value={oppTab} onChange={setOppTab}
              options={[{ value: "missing", label: `Missing ${missing.length}` }, { value: "weak", label: `Weak ${weak.length}` }]} />
          </div>
          {oppRows.length === 0 ? (
            <div style={{ padding: "22px 0", textAlign: "center", fontSize: FS.small, color: T.txtSoft }}>
              {theirs.length === 0 ? "Add a competitor to see the keywords they win." : oppTab === "missing" ? "No missing keywords against these competitors." : "No weak keywords against these competitors."}
            </div>
          ) : (
            <div className="tbl-scroll">
              <table style={{ width: "100%", minWidth: 520, borderCollapse: "collapse", fontSize: FS.body }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${T.rowBorder}` }}>
                    {["Keyword", "Volume", "Best competitor", "You", ""].map((h) => <th key={h} scope="col" style={{ ...th, paddingLeft: 0 }}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {oppRows.map((o) => {
                    const key = "kw:" + o.k;
                    const done = queued.includes(key);
                    return (
                      <tr key={o.k} style={{ borderBottom: `1px solid ${T.rowBorder}` }}>
                        <td style={{ padding: "10px 12px 10px 0", color: T.txt, fontWeight: FW.medium }}>{o.k}</td>

                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Glass>
      </div>
    </div>
  );
}

/* Sites that plausibly link to a page in this space. DR is the linking site's
   own rating. */
const LINK_POOL = [
  { domain: "g2.com", dr: 91 }, { domain: "capterra.com", dr: 88 }, { domain: "producthunt.com", dr: 91 },
  { domain: "reddit.com", dr: 92 }, { domain: "alternativeto.net", dr: 84 }, { domain: "indiehackers.com", dr: 83 },
  { domain: "dev.to", dr: 88 }, { domain: "medium.com", dr: 95 }, { domain: "mailtrap.io", dr: 78 },
  { domain: "emailtooltester.com", dr: 69 }, { domain: "saasworthy.com", dr: 71 }, { domain: "superuser.com", dr: 90 } ];
const INTENT_WORD = { I: "Info", N: "Nav.", C: "Commercial", T: "Trans." };
const ENGINE_WEIGHT = { chatgpt: 1, perplexity: 0.8, gemini: 0.7, claude: 0.5, deepseek: 0.3, grok: 0.2 };

const pageDetailCache = {};
function pageDetailFor(url) {
  if (pageDetailCache[url]) return pageDetailCache[url];
  const sp = SITE_PAGES.find((p) => p.url === url) || { url, idx: "Indexed", cov: "Submitted and indexed", clicks: 0, pos: null, score: null, src: ["GSC"] };
  const f = perfOf(url);
  const r = (k) => seeded(`${OUR_DOMAIN}|${url}|${k}`);

  /* Traffic splits across the page's keywords by volume, weighted toward the
     keywords it is known for, and adds up to the page's clicks. */
  const rows = PAGE_KEYWORDS[url] || (f.top ? [{ kw: f.top, intent: INTENT_WORD[f.intent[0]] || "Info", vol: 90 + Math.round(r("v") * 400), kd: 12 + Math.round(r("kd") * 30), cpc: +(0.4 + r("cpc") * 2).toFixed(2) }] : []);
  const w = rows.map((k, i) => Math.sqrt(k.vol) * Math.pow(0.62, i));
  const wsum = w.reduce((a, b) => a + b, 0) || 1;
  let left = sp.clicks;
  const keywords = rows.map((k, i) => {
    const share = w[i] / wsum;
    const traffic = i === rows.length - 1 ? left : Math.min(left, Math.round(sp.clicks * share));
    left -= traffic;
    return { ...k, traffic, pct: +(share * 100).toFixed(1) };
  });

  const rd = f.rd;
  const picks = [...LINK_POOL].sort((a, b) => seeded(`${url}|lk|${a.domain}`) - seeded(`${url}|lk|${b.domain}`)).slice(0, Math.min(4, rd));
  const anchors = [...new Map([rows[0] && rows[0].kw, rows[1] && rows[1].kw, "example.com", "Inboxr", "this guide"]
    .filter(Boolean).map((a) => [a.toLowerCase(), a])).values()];
  const topBacklinks = picks.map((p, i) => ({ ...p, anchor: anchors[i % anchors.length], type: seeded(`${url}|lt|${p.domain}`) < 0.72 ? "follow" : "nofollow" }))
    .sort((a, b) => b.dr - a.dr);

  const eng = f.eng.length ? f.eng : [];
  const ew = eng.map((e) => ENGINE_WEIGHT[e] * (0.7 + r("ew" + e) * 0.6));
  const ewsum = ew.reduce((a, b) => a + b, 0) || 1;
  const aiSources = eng.map((e, i) => ({ engine: e, pct: Math.round((ew[i] / ewsum) * 100), m: Math.round(f.cites * (ew[i] / ewsum)) }))
    .sort((a, b) => b.m - a.m);
  const aiTrend = Array.from({ length: 8 }, (_, i) => ({
    d: `W${i + 1}`,
    mentions: Math.round((f.cites / 4.3) * (0.55 + (i / 7) * 0.45) * (i === 7 ? 1 : 1 + (r("at" + i) - 0.5) * 0.2)) }));

  const kind = pageKind(url);
  const faq = r("faq") > 0.6;
  const lcp = +(1.8 + r("lcp") * 1.6).toFixed(1);
  const detail = {
    authority: Math.round(Math.min(88, 10 + Math.log2(1 + rd) * 5.5 + Math.log2(1 + sp.clicks) * 2)),
    aiScore: Math.round(Math.min(95, 12 + Math.log2(1 + f.cites) * 8)),
    organicTraffic: sp.clicks,
    organicKeywords: Math.max(f.kws, keywords.length),
    /* Only the pages the ads point at carry paid traffic. */
    paidTraffic: url === "/" ? 14 : url === "/pricing" ? 5 : 0,
    paidKeywords: url === "/" ? 4 : url === "/pricing" ? 2 : 0,
    backlinks: rd ? Math.round(rd * (2.5 + r("bl") * 5)) : 0,
    refDomains: rd,
    newLinks: Math.round(rd * r("nl") * 0.25),
    cites: f.cites,
    citesChange: f.cites ? Math.round((r("cc") - 0.3) * 30) : 0,
    keywords, topKeywords: keywords.slice(0, 3), topBacklinks, aiSources, aiTrend,
    words: Math.round(900 + r("w") * 1400),
    updated: Math.round(20 + r("u") * 300),
    lcp, faq,
    tech: {
      idx: sp.idx, cov: sp.cov,
      inp: Math.round(90 + r("inp") * 160), cls: +(0.02 + r("cls") * 0.14).toFixed(2),
      mobile: r("mob") > 0.15,
      speed: Math.round(Math.max(38, Math.min(96, 104 - lcp * 11))),
      schema: [kind === "article" ? "Article" : "Organization", "BreadcrumbList", ...(faq ? ["FAQPage"] : [])],
      broken: r("br") < 0.6 ? 0 : r("br") < 0.85 ? 1 : 2 } };
  pageDetailCache[url] = detail;
  return detail;
}

// Traffic over the chosen range, scaled to the page's own monthly traffic
function genTrafficData(days, url) {
  const pd = pageDetailFor(url || "/");
  const now = new Date(2026, 2, 9);
  const data = [];
  const step = days <= 1 ? 2 : days <= 3 ? 6 : days <= 7 ? 12 : days <= 14 ? 24 : 48;
  const pts  = days <= 1 ? 12 : days <= 3 ? 12 : days <= 7 ? 14 : days <= 14 ? 14 : 14;
  const orgPerHour = pd.organicTraffic / (30 * 24);
  const paidPerHour = pd.paidTraffic / (30 * 24);
  for (let i = pts - 1; i >= 0; i--) {
    const t = new Date(now - i * step * 3600000);
    const label = days <= 1
      ? t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : t.toLocaleDateString([], { month: "short", day: "numeric" });
    const wob = 1 + Math.sin(i * 0.8) * 0.3 + (seeded(`${url}|${days}|${i}`) - 0.5) * 0.3;
    data.push({
      d: label,
      organic: Math.max(0, Math.round(orgPerHour * step * wob)),
      paid:    Math.max(0, Math.round(paidPerHour * step * wob)) });
  }
  return data;
}

const OUR_SITE = {

  s: { content: 72, links: 41, speed: 78, ai: 74, coverage: 38, tech: 88 } };
const RADAR_DIMS = [
  { id: "content", label: "Content depth", lead: "Longer, more complete pages on the topics you share" },
  { id: "links", label: "Backlinks", lead: "More sites linking in, and stronger ones" },
  { id: "speed", label: "Page speed", lead: "Faster pages, better experience signals" },
  { id: "ai", label: "AI visibility", lead: "Cited more often in AI answers" },

  { id: "tech", label: "Technical SEO", lead: "Cleaner crawl structure and fewer errors" } ];
const MARKET_KEYWORDS = [
  { kw: "email warmup", vol: 6600, you: 24 }, { kw: "google postmaster tools", vol: 9900, you: 14 },
  { kw: "email spam checker", vol: 8100, you: 38 }, { kw: "email warmup tool", vol: 2900, you: 31 },
  { kw: "best email warmup tool", vol: 1900, you: null }, { kw: "instantly alternative", vol: 1900, you: null },
  { kw: "free email warmup", vol: 1600, you: 42 }, { kw: "dmarc quarantine vs reject", vol: 1300, you: 9 },
  { kw: "cold email deliverability", vol: 1000, you: null }, { kw: "how long to warm up email", vol: 720, you: 9 },
  { kw: "lemwarm alternative", vol: 390, you: 17 }, { kw: "warmy alternative", vol: 260, you: 10 } ];
const MARKET_TOPICS = [
  "Cold email deliverability guide", "Email warmup for Google Workspace", "Outlook and Microsoft 365 warmup",
  "Free SPF, DKIM and DMARC generator", "Inbox placement test tool", "Warmup pricing comparison",
  "Warmup for agencies with many inboxes", "Deliverability benchmarks report", "Sender reputation checker", "Cold email templates library" ];
const MAX_TRACKED = 4;
const fmtCompact = (v) => (v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + "K" : String(v));

function siteProfile(domain) {
  if (COMPETITOR_SITES[domain]) return { domain, ...COMPETITOR_SITES[domain] };
  const r = (k) => seeded(`${domain}|site|${k}`);
  const auth = 28 + (hashStr(domain) % 45);
  const traffic = Math.round(Math.pow(10, 3 + auth / 28) * (0.6 + r("t")));
  const sc = (k) => Math.round(45 + r(k) * 45);
  return {
    domain, auth, traffic, kws: Math.round(traffic / (6 + r("k") * 8)), rd: Math.round(Math.pow(10, 1.5 + auth / 30)),
    backlinks: Math.round(Math.pow(10, 1.5 + auth / 30) * (8 + r("b") * 30)), ai: sc("ai"), pages: Math.round(40 + r("p") * 900),
    s: { content: sc("content"), links: Math.min(95, Math.round(auth * 1.05)), speed: sc("speed"), ai: sc("ai"), coverage: sc("coverage"), tech: sc("tech") } };
}

function CompetitiveResearch({ sub }) {
  const { T, toast, go } = useT();
  const [tracked, setTracked] = useState([
    { domain: "instantly.ai", fam: COMP_FAMILIES[0] },
    { domain: "warmy.io", fam: COMP_FAMILIES[1] },
    { domain: "trulyinbox.com", fam: COMP_FAMILIES[2] } ]);
  const [selected, setSelected] = useState("instantly.ai");
  const [draft, setDraft] = useState("");
  const [note, setNote] = useState("");

  const sites = tracked.map((t) => ({ ...siteProfile(t.domain), fam: t.fam }));
  const you = { ...OUR_SITE, fam: "traffic", you: true };
  const all = [you, ...sites];
  const them = sites.find((s) => s.domain === selected) || sites[0];
  const colorOf = (e) => cat(e.fam, T);

  const add = (raw) => {
    const d = cleanDomain(raw);
    if (!d || !d.includes(".")) { setNote("Enter a domain like competitor.com."); return; }
    if (d === OUR_DOMAIN) { setNote("That's your own site."); return; }
    if (tracked.some((t) => t.domain === d)) { setNote(`${d} is already tracked.`); return; }
    if (tracked.length >= MAX_TRACKED) { setNote(`Up to ${MAX_TRACKED} competitors. Remove one to add another.`); return; }
    const used = tracked.map((t) => t.fam);
    setTracked([...tracked, { domain: d, fam: COMP_FAMILIES.find((f) => !used.includes(f)) }]);
    if (!tracked.length) setSelected(d);
    setDraft(""); setNote("");
  };
  const remove = (d) => {
    const next = tracked.filter((t) => t.domain !== d);
    setTracked(next);
    if (selected === d && next.length) setSelected(next[0].domain);
    setNote("");
  };
  const suggestions = Object.keys(COMPETITOR_SITES).filter((d) => !tracked.some((t) => t.domain === d));

  const COLS = [
    { id: "auth", label: "Authority", fmt: (v) => v },
    { id: "traffic", label: "Organic traffic", fmt: (v) => fmtCompact(v) },
    { id: "kws", label: "Keywords", fmt: (v) => fmtCompact(v) },
    { id: "backlinks", label: "Backlinks", fmt: (v) => fmtCompact(v) },
    { id: "rd", label: "Ref. domains", fmt: (v) => fmtCompact(v) },
    { id: "ai", label: "AI visibility", fmt: (v) => `${v}/100` },
    { id: "pages", label: "Pages indexed", fmt: (v) => v.toLocaleString() } ];
  const best = (id) => (all.length < 2 ? undefined : Math.max(...all.map((e) => e[id])));

  const th = { textAlign: "left", padding: "0 12px 10px", color: T.txtSoft, fontWeight: FW.medium, fontSize: FS.micro, letterSpacing: 1.2, textTransform: "uppercase", whiteSpace: "nowrap" };
  const chip = { display: "inline-flex", alignItems: "center", gap: 8, height: 30, padding: "0 11px", borderRadius: R.pill,
    border: `1px solid ${T.innerBorder}`, background: T.innerCard, fontSize: FS.small, color: T.txt, fontWeight: FW.medium, fontFamily: "inherit" };

  /* Keyword head-to-head against the selected site: its positions are seeded
     from its strength, yours are the site's real positions. */
  const kwRows = them ? MARKET_KEYWORDS.map((k) => {
    const r = (x) => seeded(`${them.domain}|mk|${k.kw}|${x}`);
    const own = k.kw.startsWith(them.domain.split(".")[0]);
    const pos = own || r("in") < 0.12 ? null : Math.max(1, Math.round(1 + r("p") * 26 * (1.35 - them.auth / 100)));
    let step;
    if (pos == null && k.you == null) step = "Open ground: neither ranks";
    else if (pos == null) step = "Defend: they don't rank";
    else if (k.you == null) step = "New content needed";
    else if (k.you <= pos) step = "Defend your lead";
    else if (k.you <= 15) step = "Close the gap";
    else step = "Rework the page";
    return { ...k, them: pos, step };
  }) : [];

  const gaps = them ? MARKET_TOPICS.map((t) => {
    const r = (x) => seeded(`${them.domain}|mt|${t}|${x}`);
    return { topic: t, has: r("has") < 0.62, pages: 1 + Math.floor(r("pg") * 5), est: Math.round((them.traffic / 400) * (0.3 + r("tr") * 1.4)), kd: Math.round(18 + r("kd") * 40) };
  }).filter((g) => g.has).slice(0, 5) : [];
  const leads = them ? RADAR_DIMS.filter((d) => you.s[d.id] > them.s[d.id]) : [];
  const radar = them ? RADAR_DIMS.map((d) => ({ subject: d.label, you: you.s[d.id], comp: them.s[d.id] })) : [];

  return (
    <div>
      <TabTitle section="competitive" sub={sub} />

      {/* ── TRACKED COMPETITORS ── */}
      <Glass style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
          <Lbl color={T.primary}>Your competitors</Lbl>
          <span style={{ fontSize: FS.small, color: T.txtSoft, ...NUM }}>{tracked.length} of {MAX_TRACKED} tracked · select one to compare</span>
        </div>
        <div role="radiogroup" aria-label="Competitor to compare" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 8, marginBottom: 14 }}>
          {sites.map((s) => {
            const on = them && s.domain === them.domain;
            return (
              <div key={s.domain} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 8px 10px 12px", borderRadius: R.md,
                border: `1px solid ${on ? colorOf(s) : T.innerBorder}`, background: on ? mixHex(colorOf(s), T.surface, 0.08) : T.innerCard }}>
                <button type="button" role="radio" aria-checked={on} onClick={() => setSelected(s.domain)}
                  style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 10, background: "none", border: 0, padding: 0, cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}>
                  <span aria-hidden="true" style={{ width: 10, height: 10, borderRadius: 3, background: colorOf(s), flexShrink: 0 }} />
                  <span style={{ minWidth: 0 }}>
                    <span style={{ display: "block", fontSize: FS.body, color: T.txt, fontWeight: FW.bold }}>{s.domain}</span>
                    <span style={{ display: "block", fontSize: FS.micro, color: T.txtSoft, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", ...NUM }}>
                      Authority {s.auth} · {fmtCompact(s.traffic)}/mo · {fmtCompact(s.kws)} keywords
                    </span>
                  </span>
                </button>
                <button type="button" onClick={() => remove(s.domain)} aria-label={`Remove ${s.domain}`} title={`Remove ${s.domain}`}
                  style={{ width: 26, height: 26, borderRadius: "50%", border: 0, background: "transparent", color: T.txtSoft, cursor: "pointer",
                    display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, flexShrink: 0 }}><Ico n="x" size={13} sw={2} /></button>
              </div>
            );
          })}
        </div>
        <form onSubmit={(ev) => { ev.preventDefault(); add(draft); }} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <div style={{ flex: "1 1 260px", maxWidth: 420 }}>
            <Field value={draft} onChange={(v) => { setDraft(v); setNote(""); }} placeholder="Add a competitor: competitor.com" ariaLabel="Competitor domain" />
          </div>
          <Btn type="submit" primary icon="plus" disabled={tracked.length >= MAX_TRACKED}>Add competitor</Btn>
          {note && <span role="status" style={{ fontSize: FS.small, color: T.warn }}>{note}</span>}

        {suggestions.length > 0 && tracked.length < MAX_TRACKED && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
            <span style={{ fontSize: FS.small, color: T.txtSoft }}>Suggested:</span>
            {suggestions.map((d) => (
              <button key={d} type="button" onClick={() => add(d)} style={{ ...chip, cursor: "pointer" }}><Ico n="plus" size={12} sw={2} />{d}</button>
            ))}
          </div>
        )}
      </Glass>

      {!them && (
        <Glass>
          <div style={{ padding: "40px 20px", textAlign: "center" }}>
            <div style={{ fontSize: FS.body, color: T.txt, fontWeight: FW.bold, marginBottom: 6 }}>No competitors tracked yet</div>
            <div style={{ fontSize: FS.small, color: T.txtSoft }}>Add a competitor above to compare traffic, keywords, backlinks and AI visibility.</div>
          </div>

      {them && (!sub || sub === "comp-overview") && (
        <div>
          <Glass style={{ marginBottom: 16 }}>

            <div className="tbl-scroll">
              <table style={{ width: "100%", minWidth: 860, borderCollapse: "collapse", fontSize: FS.body }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${T.rowBorder}` }}>
                    <th scope="col" style={th}>Domain</th>
                    {COLS.map((c) => <th key={c.id} scope="col" style={th}>{c.label}</th>)}

                <tbody>
                  {all.map((e) => (

                      {COLS.map((c) => {

                          <td key={c.id} title={win ? "Best in this comparison" : undefined} style={{ padding: "11px 12px", whiteSpace: "nowrap", color: T.txt, ...NUM,

          </Glass>

          <div className="split-16" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <Glass accent>
              <Lbl color={T.primary}>You vs. {them.domain}</Lbl>

                    <Radar name={them.domain} dataKey="comp" stroke={colorOf(them)} fill={colorOf(them)} fillOpacity={0.08} strokeWidth={2} strokeDasharray={COMP_DASH[them.fam] || "4 4"} />

                <span style={{ textAlign: "right", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{them.domain.split(".")[0]}</span>

                  </div>

          </div>

      )}

      {them && sub === "comp-head-to-head" && (
        <Glass>

/* ══════════════════════════════════════════════════════
   TOP BAR CONTROLS
   The shortcut hint has to be right on both platforms. A Mac user shown
   "Ctrl K" concludes the shortcut is not meant for them, so the label follows
   the machine it is being read on.
══════════════════════════════════════════════════════ */
const IS_MAC = typeof navigator !== "undefined" &&
  /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent || "");
const MOD_KEY = IS_MAC ? "⌘" : "Ctrl";

/* A switch, not a lone icon button. One icon tells you nothing about which
   state you are in until after you have pressed it; a track with a thumb shows
   its position at rest. The thumb carries the mode you are in, the empty half
   of the track shows the one you would move to. */
function ThemeSwitch() {
  const { mode, flip, T } = useT();
  const dark = mode === "dark";
  return (
    <button type="button" role="switch" aria-checked={dark} onClick={flip}
      aria-label="Dark mode"
      title={dark ? "Switch to light mode" : "Switch to dark mode"}
      style={{
        position: "relative", width: 54, height: 28, flexShrink: 0, padding: 0,
        border: `1px solid ${T.btnGhostBorder}`, borderRadius: R.pill,
        background: dark ? T.activeNav : T.btnGhost, cursor: "pointer",
        display: "inline-flex", alignItems: "center", fontFamily: "inherit",
        transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease` }}>
      <span aria-hidden="true" style={{
        position: "absolute", top: 0, bottom: 0, [dark ? "left" : "right"]: 9,
        display: "flex", alignItems: "center", color: T.txtSoft }}>
        <Ico n={dark ? "sun" : "moon"} size={12} sw={1.9} />
      </span>
      <span aria-hidden="true" style={{
        position: "absolute", top: 2, left: dark ? 27 : 2, width: 23, height: 23, borderRadius: "50%",
        display: "flex", alignItems: "center", justifyContent: "center",
        background: dark ? T.primary : "#ffffff", color: dark ? "#04140d" : A.amber,
        boxShadow: dark ? "none" : "0 1px 3px rgba(10,10,10,0.2)",
        transition: `left ${DUR.hover} ${BACK}, background ${DUR.micro} ease, color ${DUR.micro} ease` }}>
        <Ico n={dark ? "moon" : "sun"} size={12.5} sw={2} />
      </span>
    </button>
  );
}

/* One shell for every top-bar popover, so they cannot drift apart. */
function TopMenu({ width = 300, right = 18, children, labelledBy }) {
  const { T } = useT();
  return (
    <div role="menu" aria-labelledby={labelledBy} style={{
      position: "fixed", top: 68, right, width, maxWidth: "calc(100vw - 24px)", zIndex: 31,
      background: T.notifBg, border: `1px solid ${T.glassBorder}`,
      borderRadius: 10, overflow: "hidden",
      boxShadow: T.mode === "dark" ? "0 12px 32px rgba(0,0,0,0.35)" : "0 28px 70px -12px rgba(10,10,10,0.22)",
      animation: "popIn 0.26s cubic-bezier(.22,1,.36,1)" }}>
      {children}
    </div>
  );
}

function MenuHead({ children, onClose, label }) {

function App() {
  /* Dark is the resting state of this product, so it is what loads. */
  const [mode, setMode] = useState("dark");
  const [page, setPage] = useState("command");
  const [sub, setSub] = useState(null);
  const [selectedReport, setSelectedReport] = useState("/blog/google-postmaster-tools-v2-after-v1-retired");
  const [sidebar, setSidebar] = useState(false);
  const [showNotifs, setShowNotifs] = useState(false);
  const [showSearch, setShowSearch] = useState(false);
  const [showReports, setShowReports] = useState(false);
  const [showAsk, setShowAsk] = useState(false);
  const [showProfile, setShowProfile] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [booted, setBooted] = useState(false);
  const [syncsAgo, setSyncsAgo] = useState(2);

  const T = THEMES[mode];
  const flip = () => setMode((m) => (m === "light" ? "dark" : "light"));
  /* Only one thing hangs off the top bar at a time, so every opener closes
     the rest rather than each caller remembering to. */
  const closeMenus = useCallback(() => {
    setShowNotifs(false); setShowSearch(false);
    setShowReports(false); setShowAsk(false); setShowProfile(false);
  }, []);
  const go = (p, s = null, report = null) => { if (report) setSelectedReport(report); setPage(p); setSub(s); closeMenus(); };
  const active = NAV.find((n) => n.id === page);
  const unreadCount = NOTIFICATIONS.filter(n => !n.read).length;

  const toast = useCallback((msg, icon, color) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t.slice(-3), { id, msg, icon, color }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3600);
  }, []);

  /* Close on an outside press or on Escape. The command palette brings its
     own scrim, so it is not in this set. */
  const menusOpen = showNotifs || showReports || showAsk || showProfile;
  useEffect(() => {
    if (!menusOpen) return;
    const away = (e) => {
      const el = e.target;
      if (el && el.closest && el.closest('[role="menu"], [data-topbar]')) return;
      closeMenus();
    };
    const esc = (e) => { if (e.key === "Escape") closeMenus(); };
    document.addEventListener("mousedown", away);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", away); document.removeEventListener("keydown", esc); };
  }, [menusOpen, closeMenus]);

  useEffect(() => { const t = setTimeout(() => setBooted(true), 950); return () => clearTimeout(t); }, []);
  useEffect(() => { const t = setInterval(() => setSyncsAgo(s => Math.min(59, s + 1)), 60000); return () => clearInterval(t); }, []);

  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setShowSearch(s => !s); setShowNotifs(false); }
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "d") { e.preventDefault(); flip(); }
      if (e.key === "Escape") { setShowSearch(false); setShowNotifs(false); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  useEffect(() => {
    if (!booted) return;

                onMouseLeave={e => { e.currentTarget.style.background = showReports ? T.activeNav : T.btnGhost; e.currentTarget.style.color = showReports ? T.primary : T.txtMid; }}>
                <Ico n="doc" size={14} sw={1.8} />
                <span className="tb-hide-md">Reports</span>
                <span aria-hidden="true" className="tb-hide-md" style={{ display: "flex", opacity: 0.7,
                  transform: showReports ? "rotate(180deg)" : "none", transition: `transform ${DUR.micro} ease` }}><Ico n="chevD" size={12} sw={2} /></span>
              </button>

              <span aria-hidden="true" className="tb-hide-md" style={{ width: 1, height: 22, background: T.panelBorder, flexShrink: 0 }} />

              <ThemeSwitch />

              <button onClick={() => { const was = showNotifs; closeMenus(); setShowNotifs(!was); }}
                aria-label={unreadCount > 0 ? `Notifications, ${unreadCount} unread` : "Notifications"}
                aria-expanded={showNotifs} style={{
                position: "relative", background: showNotifs ? T.activeNav : "transparent",
                border: `1px solid ${showNotifs ? `${T.primary}45` : T.btnGhostBorder}`,
                borderRadius: "50%", color: showNotifs ? T.primary : T.txtMid, cursor: "pointer", width: 34, height: 34, flexShrink: 0,
                display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit",
                transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease, color ${DUR.micro} ease` }}
                onMouseEnter={e => { e.currentTarget.style.background = T.spot; }}
                onMouseLeave={e => { e.currentTarget.style.background = showNotifs ? T.activeNav : "transparent"; }}>
                <Ico n="bell" size={15.5} sw={1.8} />
                {unreadCount > 0 && (
                  <span aria-hidden="true" style={{
                    position: "absolute", top: -3, right: -3, minWidth: 16, height: 16, padding: "0 4px", boxSizing: "border-box",
                    background: A.red, color: "#fff", borderRadius: R.pill, fontSize: FS.micro, fontWeight: FW.bold,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    border: `2px solid ${T.panel}` }}>{unreadCount}</span>
                )}
              </button>

              <button id="tb-profile" type="button" aria-label="Account and workspace settings" aria-expanded={showProfile}
                onClick={() => { const was = showProfile; closeMenus(); setShowProfile(!was); }}
                style={{ position: "relative", cursor: "pointer", background: "none", border: "none", padding: 0, font: "inherit", color: "inherit", flexShrink: 0, borderRadius: "50%" }}>
                <span aria-hidden="true" style={{ width: 32, height: 32, background: T.tagBg,
                  border: `1px solid ${showProfile ? `${T.primary}66` : T.tagBorder}`, borderRadius: "50%",
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: FS.micro, color: T.primary, fontWeight: FW.bold,
                  transition: `border-color ${DUR.micro} ease` }}>RR</span>
              </button>
            </div>
          </header>

          <LiveTicker />

          <main id="main" className="screen" key={page + (sub || "") + mode} style={{ flex: 1, overflowY: "auto", padding: "32px 36px 22px", width: "100%" }}>
            {page !== "command" && active.sub.length > 0 && (
              <div aria-label="Section navigation" style={{ display: "flex", gap: 5, overflowX: "auto", whiteSpace: "nowrap", marginBottom: 25, paddingBottom: 12, borderBottom: `1px solid ${T.panelBorder}`, scrollbarWidth: "none" }}>
                {active.sub.map((s) => {
                  const isSel = (sub || active.sub[0].id) === s.id;
                  return (
                    <button key={s.id} aria-current={isSel ? "page" : undefined} onClick={() => go(page, s.id)}
                      style={{
                        padding: "7px 10px", border: 0, borderRadius: 8, background: isSel ? T.activeNav : "none",
                        fontSize: 12, color: isSel ? T.primary : T.txtSoft,
                        cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap", flexShrink: 0,
                        transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease, color ${DUR.micro} ease` }}
                    >{s.label}</button>
                  );
                })}
              </div>
            )}
            {page === "command" && <PremiumOverview go={go} />}
            {page === "web-analytics" && <WebAnalytics />}
            {page === "intelligence" && <SiteIntelligence sub={sub} />}
            {page === "page-report" && <PageReport sub={sub} go={go} initialPage={selectedReport} />}
            {page === "actions" && <ActionsHub sub={sub} />}
            {page === "llm-council" && <LLMCouncil sub={sub} />}
            {page === "competitive" && <CompetitiveResearch sub={sub} />}
            {page === "creative" && <CreativeStudio sub={sub} />}
            {page === "settings" && <Settings sub={sub} />}
          </main>

          {/* STATUS BAR */}
          <footer style={{
            height: 30, flexShrink: 0, display: "flex", alignItems: "center", gap: 18, padding: "0 20px",
            background: T.panel,
            borderTop: `1px solid ${T.panelBorder}`, fontSize: 12, color: T.txtSoft }}>
            <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <span className="live-dot" style={{ width: 6, height: 6, borderRadius: "50%", background: T.accent }} />
              All systems operational
            </span>
            <span className="tb-hide-sm" style={{ opacity: 0.75 }}>v2.0.0</span>
            <span style={{ background: `${T.primary}12`, border: `1px solid ${T.primary}2c`, color: T.primary, fontSize: 11, fontWeight: 800, letterSpacing: 1.4, borderRadius: 8, padding: "2px 7px", textTransform: "uppercase" }}>Public Beta</span>
            <span className="tb-hide-sm" style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 18 }}>
              <span>last audit {syncsAgo}m ago</span>
              <span>next in 21h 5{syncsAgo % 10}m</span>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>press <Kbd>⌘ K</Kbd> for command</span>
            </span>
          </footer>
        </div>
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function () {
  var tries = 0;
  var t = setInterval(function () {
    tries++;
    var rootEl = document.getElementById('root');
    if ((rootEl && rootEl.hasChildNodes()) || tries > 100) {
      clearInterval(t);
      var b = document.getElementById('boot');
      if (b) {
        b.style.transition = 'opacity 0.45s ease';
        b.style.opacity = '0';
        setTimeout(function () { b.remove(); }, 480);
      }
    }
  }, 60);
})();
</script>
<script>
var t = setTimeout(function () {
  if (!document.querySelector('#root') || !document.querySelector('#root').hasChildNodes()) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'Still loading… if this persists, check your internet connection (CDN assets required).';
  }
  clearTimeout(t);
}, 12000);
</script>
</body>
</html>
