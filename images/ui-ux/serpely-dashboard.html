  body{background:#080b09;font-family:'Satoshi',-apple-system,'Segoe UI',Arial,sans-serif}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#080b09;z-index:9}

  #boot .sub{font-size:10px;color:#6b736d;letter-spacing:1.6px;text-transform:uppercase;font-family:'Satoshi',-apple-system,'Segoe UI',Arial,sans-serif}

/* BRAND PALETTE
   Sourced from the shipped site (serpely-homepage-v3.html, serpely-blog.html)
   and the logo PNGs. Not from a framework default palette.
   Contrast, measured, not assumed:
     deep   on #ffffff .... 4.75:1  -> AA for body text
     green  behind #07130d  8.38:1  -> the logo's own black-on-green relationship
     bright on #0a0a0a .... 11.4:1  -> AA for body text in dark mode
   green (#00c27a) is 3.1:1 on white, so it is a FILL only, never text on paper. */
const BRAND = {
  bright: "#00e08f",
  green: "#00c27a",
  mid: "#00a868",
  deep: "#008451",
  ring: "#00ff88" };

/* CATEGORICAL PALETTE.
   Produced by iterating the dataviz skill's validator, not chosen by eye:
     node scripts/validate_palette.js "<hexes>" --mode light --surface "#f0fbf6"
     node scripts/validate_palette.js "<hexes>" --mode dark  --surface "#15151a"
   Both sets report ALL CHECKS PASS across lightness band, chroma floor, CVD
   separation, normal-vision floor and contrast. Two earlier candidates failed
   and were discarded (blue vs violet at deutan dE 2.5; teal under chroma floor).

   Worst-pair tritan dE lands at 4.9-6.0, inside the 6-8 floor band, which is
   legal ONLY with secondary encoding. Every element tinted from this palette
   must also carry a label or an icon. Colour alone is never the signal.

   A metric family owns its hue permanently. Colour follows the entity, never
   its rank, so filtering or reordering never repaints a series. */
const CAT = {
  traffic:     { light: "#008451", dark: "#00A165" },
  impressions: { light: "#2A78D6", dark: "#4780D4" },
  rankings:    { light: "#B26A00", dark: "#BC801B" },
  engagement:  { light: "#C2407A", dark: "#CE5078" },
  ai:          { light: "#5B4BC4", dark: "#7A6AD2" },
  /* Added for the two Analytics metrics. Re-validated at seven slots rather
     than eyeballed: teal read as grey (chroma 0.088, under the 0.1 floor) and
     was re-stepped to this cyan before it passed. */
  sessions:    { light: "#0089A7", dark: "#1E93AE" },
  people:      { light: "#B03A2E", dark: "#C4564A" },
  outcome:     { light: "#6D28A8", dark: "#9A6BD0" } };
/* cat("rankings", T) -> the hue for the active theme. */
const cat = (family, T) => (CAT[family] || CAT.traffic)[T.mode === "dark" ? "dark" : "light"];
/* Face wash for a stat tile.
   This used to emit `${c}0b`, which is an 8-digit hex whose last byte is the
   ALPHA channel, so every tinted card faded to 96% transparent and the canvas
   showed straight through it. Mix to an opaque hex instead: a card is a
   surface, and a surface is never see-through. */
const mixHex = (fg, bg, amount) => {
  const f = fg.replace("#", ""), b = bg.replace("#", "");
  const ch = (h, i) => parseInt(h.slice(i * 2, i * 2 + 2), 16);
  const out = [0, 1, 2].map((i) => Math.round(ch(f, i) * amount + ch(b, i) * (1 - amount)));
  return "#" + out.map((v) => v.toString(16).padStart(2, "0")).join("");
};
const catFace = (family, T) => {
  const c = cat(family, T);
  return `linear-gradient(135deg, ${T.surface} 0%, ${mixHex(c, T.surface, 0.06)} 100%)`;
};
/* Two-stop vertical fill for an area series. */
const catFill = (c, top = 0.22) => [
  { offset: "0%", color: c, opacity: top },
  { offset: "100%", color: c, opacity: 0 },
];

/* SCALES. One type scale, one weight set, one radius rule.
   Body floor is 14. 11 is micro-label only, never prose. */
const FS = { micro: 11, small: 12, body: 14, lead: 16, h3: 20, h2: 24, h1: 32 };
/* Satoshi ships 400/500/700/800/900. Any other number silently rounds to one
   of these, so only these five exist here. */
const FW = { normal: 400, medium: 500, bold: 700, heavy: 800, black: 900 };
const R = { sm: 4, md: 8, pill: 999 };
/* Every figure in this product sits in a column next to another figure. */
/* Satoshi has genuine tabular figures, verified by measuring 1111111111 against
   0000000000: they render identical widths under tnum. So columns align without
   a monospace, and the data stops looking like terminal output. */
const NUM = { fontVariantNumeric: "tabular-nums", fontFeatureSettings: "'tnum'" };
const Z = { base: 1, sticky: 10, drawer: 20, overlay: 30, modal: 40, toast: 50 };

/* MOTION. The landing page runs 0.12s to 0.25s and never eases linearly.

   ENTER is a longer decelerate for content arriving on screen. */

const ENTER = "cubic-bezier(0.16, 1, 0.3, 1)";

const BACK = "cubic-bezier(0.34, 1.56, 0.64, 1)";

function Ico({ n, size = 16, sw = 1.7, style = {} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, display: "block", ...style }}>
      {ICON_PATHS[n] || ICON_PATHS.command}
    </svg>
  );
}

/* A tinted tile holding one icon: the header mark on explainer cards and the
   avatar for a council member. Tint and border are the same hue as the glyph,
   so a tile reads as one object instead of a coloured block with a sticker. */
function IconTile({ icon, color, size = 44 }) {
  return (
    <div aria-hidden="true" style={{
      width: size, height: size, borderRadius: R.md + 2, flexShrink: 0,
      display: "flex", alignItems: "center", justifyContent: "center",
      background: `${color}14`, border: `1px solid ${color}38`, color }}>
      <Ico n={icon} size={Math.round(size * 0.46)} sw={1.7} />
    </div>
  );
}

/* One chip, whether the engine has a real mark or the monogram fallback.
   The name is always exposed to assistive tech, so identity never rests on
   the glyph or on colour alone. */
function BrandMark({ engine, size = 26, showLabel = false }) {
  const { T } = useT();
  const e = ENGINE_MARKS[engine];
  if (!e) return null;
  const c = e.ink ? T.txt : e.color;
  const glyph = e.d ? (
    <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <path d={e.d} fillRule={e.rule} clipRule={e.rule} />
    </svg>
  ) : (
    <span aria-hidden="true" style={{ fontSize: size * 0.34, fontWeight: FW.heavy, letterSpacing: -0.4 }}>{e.mono}</span>
  );
  const chip = (
    <span
      title={e.label}
      style={{
        width: size, height: size, borderRadius: R.sm, display: "inline-flex",
        alignItems: "center", justifyContent: "center", flexShrink: 0,
        background: `${c}16`, border: `1px solid ${c}3d`, color: c }}
    >{glyph}</span>
  );
  if (!showLabel) return <span role="img" aria-label={e.label}>{chip}</span>;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 8, minWidth: 0 }}>
      {chip}
      <span style={{ fontSize: FS.body, color: T.txt, fontWeight: FW.medium, whiteSpace: "nowrap" }}>{e.label}</span>
    </span>
  );
}

/* Serpely infinity mark */
/* The mark stands on the surface. It is not set in a gradient tile and it does
   not glow. The supplied artwork is the brand asset; it is not restyled here. */
function Logo({ size = 34 }) {
  return (
    <img
      src={LOGO_ICON_SRC}
      alt="Serpely"
      style={{ display: "block", width: size, height: size, objectFit: "contain", flexShrink: 0 }}
    />
  );
}

/* ════════════════════════════════════════════════════════════
   ANIMATED COUNTER - eased, mono-ready
════════════════════════════════════════════════════════════ */
function AnimNum({ value, prefix = "", suffix = "", decimals = 0 }) {
  const [display, setDisplay] = useState(0);
  const num = typeof value === "string" ? parseFloat(value.replace(/[^0-9.-]/g, "")) : value;
  useEffect(() => {
    if (isNaN(num)) return;
    let start = 0;
    const duration = 1500;
    const t0 = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(num * eased);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [num]);
  if (isNaN(num)) return <>{value}</>;
  const formatted = decimals > 0 ? display.toFixed(decimals) : Math.floor(display).toLocaleString();
  return <>{prefix}{formatted}{suffix}</>;
}

/* Flat panel: surface + 1px hairline. No backdrop blur, no glow, no cursor
   spotlight. Glassmorphism is the wrong material for a data product, and the
   real serpely.com uses hairline-bordered white cards.
   A panel that takes onClick renders as a real <button> so it is focusable. */
function Panel({ children, style = {}, hover = false, accent = false, onClick, className = "", spot, ariaLabel }) {
  const { T } = useT();
  const [hov, setHov] = useState(false);
  const interactive = typeof onClick === "function";
  const lifts = hover || interactive;
  const up = hov && lifts;
  const base = {
    /* 6% green tint on the card face, the same move the landing page makes. */
    background: T.cardGrad,
    border: `1px solid ${up ? `${T.accent}55` : T.glassBorder}`,
    borderRadius: R.md,
    boxShadow: up ? T.glassAccent : (accent ? T.glassAccent : T.glassShadow),
    transform: up ? "translateY(-3px)" : "translateY(0)",
    transition: `transform ${DUR.hover} ${EASE}, box-shadow ${DUR.hover} ${EASE}, border-color ${DUR.micro} ease`,
    padding: "20px 22px",
    position: "relative",
    textAlign: "left",
    width: "100%",
    font: "inherit",
    color: "inherit",
    display: "block",
    willChange: lifts ? "transform" : undefined,
    cursor: lifts ? "pointer" : undefined,
    ...style };
  const h = { className, onMouseEnter: () => setHov(true), onMouseLeave: () => setHov(false) };
  if (interactive) {
    return <button type="button" onClick={onClick} aria-label={ariaLabel} {...h} style={base}>{children}</button>;
  }
  return <div {...h} style={base}>{children}</div>;
}

/* Pill. A status badge is a state, not a container, and the fully rounded

function Tag({ children, color, size = "sm" }) {
  const { T } = useT();
  const c = color || T.primary;
  return (
    <span style={{
      background: `${c}14`, color: c, border: `1px solid ${c}40`, borderRadius: R.pill,
      padding: size === "sm" ? "3px 10px" : "4px 13px", fontSize: FS.micro,
      fontWeight: FW.medium, letterSpacing: 0.2, whiteSpace: "nowrap",
      display: "inline-flex", alignItems: "center", gap: 5, ...NUM }}>{children}</span>
  );
}

function Bar({ val, max = 100, grad, height = 4 }) {
  const { T } = useT();
  const pct = Math.max(0, Math.min(100, (val / max) * 100));
  return (
    <div
      role="progressbar"
      aria-valuenow={Math.round(pct)}
      aria-valuemin={0}
      aria-valuemax={100}
      style={{ background: T.innerCard, border: `1px solid ${T.rowBorder}`, borderRadius: R.sm, height, overflow: "hidden" }}
    >
      <div style={{
        width: `${pct}%`, background: grad || T.primary,
        height: "100%", transition: "width 0.4s ease" }} />
    </div>
  );
}

/* The number is the point, so the number gets the weight and the ink colour.
   Colour is carried by a 2px rule, not by tinting the figure, which kept every
   metric reading as "good" regardless of what it said. */
function KPI({ label, value, sub, accent, info, family }) {
  const { T } = useT();
  const c = family ? cat(family, T) : (accent || T.primary);
  return (
    <div className="ch-card" style={{
      flex: 1, minWidth: 150,
      background: family ? catFace(family, T) : T.cardGrad,
      border: `1px solid ${T.glassBorder}`,
      borderLeft: `2px solid ${c}`,
      borderRadius: R.md,
      padding: "16px 18px",
      boxShadow: T.glassShadow,
      transition: `transform ${DUR.hover} ${EASE}, box-shadow ${DUR.hover} ${EASE}, border-color ${DUR.micro} ease`,
      willChange: "transform" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
        <span style={{ fontSize: FS.micro, color: T.txtSoft, fontWeight: FW.medium, letterSpacing: 1.2, textTransform: "uppercase" }}>{label}</span>
        {info && <InfoTooltip text={info} />}
      </div>
      <div style={{ fontSize: FS.h2, fontWeight: FW.heavy, color: T.txt, letterSpacing: -0.6, lineHeight: 1.1, ...NUM }}>{value}</div>
      {sub && <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 6, fontWeight: FW.normal }}>{sub}</div>}
    </div>
  );
}

/* Primary is the brand green carrying near-black text, which is the logo's own
   relationship and clears AA at 8.4:1. White on green does not clear it. */
function Btn({ children, primary = false, onClick, style = {}, icon, disabled = false, type = "button", ariaLabel }) {
  const { T } = useT();
  const [hov, setHov] = useState(false);
  const on = hov && !disabled;
  return (
    <button
      type={type}
      onClick={onClick}
      aria-label={ariaLabel}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      disabled={disabled}
      style={{
        background: primary ? (on ? BRAND.mid : T.primaryGrad) : (on ? T.innerCard : T.btnGhost),
        color: primary ? T.onAccent : T.txt,
        border: `1px solid ${primary ? "transparent" : (on ? T.primary : T.btnGhostBorder)}`,
        borderRadius: R.md,
        padding: icon ? "8px 14px 8px 11px" : "8px 16px",
        fontSize: FS.small,
        cursor: disabled ? "not-allowed" : "pointer",
        fontWeight: FW.bold,
        fontFamily: "inherit",
        boxShadow: primary && on ? T.glow : "none",
        transform: on ? "translateY(-1px)" : "translateY(0)",
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
        whiteSpace: "nowrap",
        minHeight: 34,
        transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease, transform ${DUR.hover} ${EASE}, box-shadow ${DUR.hover} ${EASE}`,
        opacity: disabled ? 0.45 : 1,
        ...style }}>
      {icon && <Ico n={icon} size={13} sw={1.8} />}
      {children}
    </button>
  );
}

function Kbd({ children }) {
  const { T } = useT();
  return <kbd style={{
    fontSize: FS.micro, color: T.txtMid, background: T.kbdBg, border: `1px solid ${T.innerBorder}`,
    borderRadius: R.sm, padding: "1px 5px", fontWeight: FW.medium }}>{children}</kbd>;
}


/* Form controls with the OS chrome removed and a real focus ring.
   The chevron is ours, drawn from the icon set, because the native one cannot
   be themed and is the single clearest tell that a select was left unstyled. */
function Select({ value, onChange, options, ariaLabel }) {
  const { T } = useT();
  return (
    <div style={{ position: "relative", width: "100%" }}>
      <select
        aria-label={ariaLabel}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        style={{
          width: "100%", background: T.inputBg, color: T.txt,
          border: `1px solid ${T.innerBorder}`, borderRadius: R.md,
          padding: "10px 36px 10px 12px", fontSize: FS.body, cursor: "pointer",
          transition: `border-color ${DUR.micro} ease` }}
      >
        {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
      <span aria-hidden="true" style={{
        position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)",
        color: T.txtSoft, display: "flex", pointerEvents: "none" }}><Ico n="chevD" size={14} sw={2} /></span>
    </div>
  );
}

function Field({ value, onChange, placeholder, multiline = false, ariaLabel }) {
  const { T } = useT();
  const base = {
    width: "100%", background: T.inputBg, color: T.txt,
    border: `1px solid ${T.innerBorder}`, borderRadius: R.md,
    padding: "10px 12px", fontSize: FS.body, outline: "none",
    transition: `border-color ${DUR.micro} ease` };
  if (multiline) {
    return <textarea aria-label={ariaLabel} value={value} onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder} rows={3} style={{ ...base, resize: "vertical", lineHeight: 1.5 }} />;
  }
  return <input aria-label={ariaLabel} value={value} onChange={(e) => onChange(e.target.value)}
    placeholder={placeholder} style={base} />;
}

/* Segmented control. One container, one hairline, and the active segment an
   elevated chip on the surface colour, rather than each segment being its own
   bordered box with a hard fill. */
function Segmented({ options, value, onChange, ariaLabel }) {
  const { T } = useT();
  return (
    <div role="group" aria-label={ariaLabel} style={{
      display: "inline-flex", background: T.innerCard, border: `1px solid ${T.innerBorder}`,
      borderRadius: R.md, padding: 3, gap: 2, flexWrap: "wrap", maxWidth: "100%" }}>
      {options.map((o) => {
        const on = value === o.value;
        return (
          <button key={o.value} type="button" aria-pressed={on} onClick={() => onChange(o.value)}
            style={{
              padding: "6px 13px", borderRadius: R.sm, fontSize: FS.small,
              fontWeight: on ? FW.bold : FW.medium,
              color: on ? T.txt : T.txtMid,
              background: on ? T.surface : "transparent",
              border: `1px solid ${on ? T.glassBorder : "transparent"}`,
              boxShadow: on ? T.glassShadow : "none",
              cursor: "pointer", whiteSpace: "nowrap", minHeight: 30,
              transition: `background ${DUR.micro} ease, color ${DUR.micro} ease` }}>{o.label}</button>
        );
      })}
    </div>
  );
}

/* Focusable wrapper for the ~36 places that had a bare onClick on a <div>.
   Gives keyboard reach, Enter/Space, and a real focus ring for free. */
function Pressable({ children, onClick, style = {}, ariaLabel, title, disabled = false }) {
  return (
    <button
      type="button"
      onClick={onClick}
      aria-label={ariaLabel}
      title={title}
      disabled={disabled}
      style={{
        background: "none", border: "none", padding: 0, margin: 0, font: "inherit",
        color: "inherit", textAlign: "left", cursor: disabled ? "not-allowed" : "pointer",
        display: "block", width: "100%",
        ...style }}
    >
      {children}
    </button>
  );
}

/* ════════════════════════════════════════════════════════════
   INFO TOOLTIP
════════════════════════════════════════════════════════════ */
function InfoTooltip({ text }) {
  const { T } = useT();
  const [show, setShow] = useState(false);
  const [pos, setPos] = useState({ anchorRight: false, anchorBelow: false });
  const trigRef = useRef(null);

  const onEnter = () => {
    if (trigRef.current) {
      const r = trigRef.current.getBoundingClientRect();
      setPos({
        anchorRight: r.left + 280 > window.innerWidth - 16,
        anchorBelow: r.top < 200 });
    }
    setShow(true);
  };

  const tipStyle = {
    position: "absolute",
    width: 280,
    ...(pos.anchorBelow ? { top: "calc(100% + 10px)" } : { bottom: "calc(100% + 10px)" }),
    ...(pos.anchorRight ? { right: 0 } : { left: 0 }),
    background: T.notifBg,
    border: `1px solid ${T.glassBorder}`, borderRadius: 8, padding: "12px 14px",
    boxShadow: T.mode === "dark"
      ? "0 16px 44px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,224,143,0.08)"
      : "0 16px 44px rgba(10,10,10,0.14), 0 0 0 1px rgba(255,255,255,0.7)",
    zIndex: 40, pointerEvents: "none",
    opacity: show ? 1 : 0,
    transform: show ? "translateY(0)" : (pos.anchorBelow ? "translateY(-6px)" : "translateY(6px)"),
    transition: "opacity 0.2s ease, transform 0.2s cubic-bezier(.22,1,.36,1)" };

  return (
    <span ref={trigRef} onMouseEnter={onEnter} onMouseLeave={() => setShow(false)}
      style={{ position: "relative", display: "inline-flex", alignItems: "center", marginLeft: 5 }}>
      <span style={{
        width: 15, height: 15, borderRadius: "50%",
        background: show ? `${T.primary}1f` : T.tagBg,
        border: `1px solid ${show ? `${T.primary}55` : T.tagBorder}`,
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        fontSize: 11, fontWeight: 800, color: show ? T.primary : T.txtSoft,
        cursor: "help", transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease, color ${DUR.micro} ease` }}>i</span>
      <div style={tipStyle}>
        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 2, textTransform: "uppercase", color: T.primary, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 4, height: 4, borderRadius: 4, background: T.primary }} />
          Why this priority?
        </div>
        <div style={{ fontSize: 12, color: T.txtMid, lineHeight: 1.65, fontWeight: 500 }}>{text}</div>
      </div>
    </span>
  );
}

function TableHead({ cols }) {
  const { T } = useT();
  return (
    <thead>
      <tr style={{ borderBottom: `1px solid ${T.innerBorder}` }}>
        {cols.map((h) => (
          <th key={h} scope="col" style={{ color: T.txtSoft, padding: "10px 14px", textAlign: "left", fontWeight: FW.medium, fontSize: FS.micro, letterSpacing: 1.2, textTransform: "uppercase", whiteSpace: "nowrap" }}>{h}</th>
        ))}
      </tr>
    </thead>
  );
}

function Sparkline({ data = [3, 5, 4, 7, 6, 8, 7, 9, 8, 10], color, width = 64, height = 24 }) {
  const { T } = useT();
  const c = color || T.primary;
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => [(i / (data.length - 1)) * width, height - 2 - ((v - min) / range) * (height - 4)]);
  const line = pts.map((p) => p.join(",")).join(" ");
  const area = `${line} ${width},${height} 0,${height}`;
  const gid = useRef("sp" + Math.random().toString(36).slice(2, 8)).current;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: "block", overflow: "visible" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c} stopOpacity="0.28" />
          <stop offset="100%" stopColor={c} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={area} fill={`url(#${gid})`} />
      <polyline fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" points={line} />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2" fill={c} />
    </svg>
  );
}

/* ════════════════════════════════════════════════════════════
   CHART TOOLTIP
════════════════════════════════════════════════════════════ */
function ChartTip({ active, payload, label }) {
  const { T } = useT();
  if (!active || !payload?.length) return null;
  return (
    <div style={{
      background: T.chartTip, border: `1px solid ${T.glassBorder}`,
      borderRadius: R.md, padding: "9px 12px", boxShadow: "none", minWidth: 140 }}>
      <div style={{ fontSize: FS.micro, fontWeight: FW.medium, color: T.txtSoft, marginBottom: 6, letterSpacing: 1.2, textTransform: "uppercase" }}>{label}</div>
      {payload.map((p, i) => {
        /* In normalised mode the plotted value is 0..1 and meaningless to a
           reader, so resolve the real figure off the row and format it with
           that metric's own formatter. The hover is the honest channel. */
        let shown = p.value;
        const key = typeof p.dataKey === "string" ? p.dataKey : "";
        if (key.startsWith("_n_")) {
          const realKey = key.slice(3);
          const meta = typeof metricById === "function" ? metricById(realKey) : null;
          const raw = p.payload ? p.payload[realKey] : undefined;
          shown = meta && typeof raw === "number" ? meta.fmt(raw) : raw;
        } else if (typeof shown === "number") {
          shown = shown.toLocaleString();
        }
        return (
          <div key={i} style={{ fontSize: FS.small, color: T.txt, fontWeight: FW.bold, display: "flex", alignItems: "center", gap: 7, padding: "2px 0", ...NUM }}>
            <span style={{ width: 8, height: 2, background: p.color, flexShrink: 0 }} />
            <span style={{ color: T.txtMid, fontWeight: FW.normal, fontSize: FS.small, fontFamily: T.sans }}>{p.name}</span>
            <span style={{ marginLeft: "auto" }}>{shown}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   BACKGROUND
   Flat paper. The four animated gradient orbs, the aurora wash, the film grain
   and the decorative corner markers are gone: none of them carried meaning, and
   three infinite keyframe loops ran behind every screen for the whole session.
════════════════════════════════════════════════════════════ */
function Bg() {
  const { T } = useT();
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 0, overflow: "hidden", pointerEvents: "none" }}>
      <div style={{ position: "absolute", inset: 0, background: T.bg, transition: `background ${DUR.hover} ease` }} />
      {/* Two large, slow brand glows. The landing page uses the same figure at
          rgba(0,194,122,0.18); at this radius it reads as atmosphere, not as a
          lava lamp. Two, not four, and they drift rather than pulse. */}
      <div style={{ position: "absolute", width: 1050, height: 1050, borderRadius: "50%", background: T.glowA, top: -400, left: -300, animation: "drift1 34s ease-in-out infinite", willChange: "transform" }} />
      <div style={{ position: "absolute", width: 880, height: 880, borderRadius: "50%", background: T.glowB, bottom: -320, right: -240, animation: "drift2 42s ease-in-out infinite", willChange: "transform" }} />
      <div style={{ position: "absolute", width: 820, height: 820, borderRadius: "50%", background: T.glowC, top: "46%", left: "34%", animation: "drift3 50s ease-in-out infinite", willChange: "transform" }} />
      {/* Graph paper. Blurred a little so the rules read as texture rather than
          as ruled lines competing with the cards on top of them, and masked to
          fall off before it reaches the content column. */}
      <div style={{
        position: "absolute", inset: 0,
        filter: "blur(0px)",
        backgroundImage:
          `linear-gradient(${T.grid} 1px, transparent 1px), linear-gradient(90deg, ${T.grid} 1px, transparent 1px),` +
          `linear-gradient(${T.gridBold} 1px, transparent 1px), linear-gradient(90deg, ${T.gridBold} 1px, transparent 1px)`,
        backgroundSize: "24px 24px, 24px 24px, 96px 96px, 96px 96px",
        maskImage: "radial-gradient(ellipse 78% 68% at 50% 34%, transparent 18%, black 78%)",
        WebkitMaskImage: "radial-gradient(ellipse 78% 68% at 50% 34%, transparent 18%, black 78%)",
        opacity: 0.85 }} />
    </div>
  );
}


/* ════════════════════════════════════════════════════════════
   DONUT SCORE
   Flat ring, one colour, no gradient and no drop shadow. The band label is
   spelled out so the reading does not depend on telling green from amber.
════════════════════════════════════════════════════════════ */
function DonutScore({ score, size = 100, label }) {
  const { T } = useT();
  const gid = useRef("ds" + Math.random().toString(36).slice(2, 8)).current;
  /* Thin stroke on a muted track. The old 7px ring on a 100 box read as a
     pie wedge; a hairline arc reads as a gauge. */
  const sw = Math.max(3, Math.round(size * 0.055));
  const r = 50 - sw / 2 - 1;
  const circ = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  const band = label || (score >= 75 ? "Good" : score >= 50 ? "Fair" : "Poor");
  const c1 = score >= 75 ? BRAND.green : score >= 50 ? T.warn : T.bad;
  const c2 = score >= 75 ? BRAND.deep : score >= 50 ? "#7a4400" : "#8e1f1f";
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" role="img"
      aria-label={`Score ${score} out of 100. ${band}.`} style={{ flexShrink: 0 }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c1} />
          <stop offset="100%" stopColor={c2} />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r={r} fill="none" stroke={T.innerBorder} strokeWidth={sw} />
      <circle cx="50" cy="50" r={r} fill="none" stroke={`url(#${gid})`} strokeWidth={sw}
        strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={offset}
        transform="rotate(-90 50 50)" style={{ transition: "stroke-dashoffset 1s " + ENTER }} />
      <text x="50" y="49" textAnchor="middle" fill={T.txt} fontSize="27" fontWeight="800"
        letterSpacing="-1.2">{score}</text>
      <text x="50" y="62" textAnchor="middle" fill={T.txtSoft} fontSize="8.5">/100</text>
      {/* The band is spelled out, so the reading never depends on arc colour. */}
      <text x="50" y="75" textAnchor="middle" fill={T.txtMid} fontSize="8" fontWeight="500"
        letterSpacing="1.4">{band.toUpperCase()}</text>
    </svg>
  );
}

/* The legend Nightwatch pairs with every donut. A ring alone says "78"; a ring
   with this says what the 78 is made of. */
function Breakdown({ rows, total }) {
  const { T } = useT();
  const sum = total || rows.reduce((a, r) => a + r.value, 0) || 1;
  return (
    <ul style={{ listStyle: "none", margin: 0, padding: 0, flex: 1, minWidth: 0, display: "grid", gap: 2 }}>
      {rows.map((r) => {
        const pct = Math.round((r.value / sum) * 100);
        return (
          <li key={r.label} style={{
            display: "flex", alignItems: "center", gap: 9, padding: "5px 0",
            borderBottom: `1px solid ${T.rowBorder}` }}>
            <span aria-hidden="true" style={{
              width: 8, height: 8, borderRadius: 4, background: r.color || T.primary, flexShrink: 0 }} />
            <span style={{ fontSize: FS.small, color: T.txtMid, flex: 1, minWidth: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.label}</span>
            <span style={{ fontSize: FS.small, color: T.txt, fontWeight: FW.bold, ...NUM }}>{r.value.toLocaleString()}</span>
            <span style={{ fontSize: FS.micro, color: T.txtSoft, width: 34, textAlign: "right", ...NUM }}>{pct}%</span>
          </li>
        );
      })}
    </ul>
  );
}

function TabBar({ tabs, active, onChange }) {
  const { T } = useT();
  return <div role="tablist" style={{ display: "flex", gap: 2, background: T.innerCard, borderRadius: R.md, padding: 3, border: "1px solid " + T.innerBorder, marginBottom: 16, width: "fit-content", maxWidth: "100%", overflowX: "auto" }}>
    {tabs.map(t => <button key={t} type="button" role="tab" aria-selected={active === t} onClick={() => onChange(t)} style={{
      padding: "7px 14px", borderRadius: R.sm, border: "1px solid transparent",
      fontWeight: active === t ? FW.bold : FW.medium, color: active === t ? T.txt : T.txtMid,
      background: active === t ? T.surface : "transparent",
      borderColor: active === t ? T.glassBorder : "transparent",
      cursor: "pointer", transition: "background 0.15s ease, color 0.15s ease",
      fontFamily: "inherit", fontSize: FS.small, whiteSpace: "nowrap", minHeight: 32 }}>{t}</button>)}
  </div>;
}

/* ════════════════════════════════════════════════════════════
   NOTIFICATION PANEL
════════════════════════════════════════════════════════════ */
function NotifPanel({ onClose }) {
  const { T } = useT();
  const [notifs, setNotifs] = useState(NOTIFICATIONS);
  const typeColor = { urgent: A.red, win: A.emerald, info: T.primary, warn: A.amber };
  const typeIcon = { urgent: "!", win: "trendUp", info: "globe", warn: "pulse" };

  const markRead = (id) => setNotifs(n => n.map(x => x.id === id ? { ...x, read: true } : x));
  const unread = notifs.filter(n => !n.read).length;

  return (
    <div style={{
      position: "fixed", top: 68, right: 18, width: 372, zIndex: 30,
      background: T.notifBg,
      border: `1px solid ${T.glassBorder}`, borderRadius: 8, overflow: "hidden",
      boxShadow: T.mode === "dark" ? "0 12px 32px rgba(0,0,0,0.35)" : "0 28px 70px -12px rgba(10,10,10,0.22)",
      animation: "popIn 0.26s cubic-bezier(.22,1,.36,1)" }}>
      <div style={{ padding: "16px 20px 13px", borderBottom: `1px solid ${T.rowBorder}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: T.txt, letterSpacing: -0.2 }}>Notifications</span>
          {unread > 0 && <span style={{ background: `${A.red}14`, color: A.red, fontSize: 11, fontWeight: 700, borderRadius: 999, padding: "2px 8px", border: `1px solid ${A.red}30` }}>{unread} new</span>}
        </div>
        <button onClick={onClose} style={{ background: T.tagBg, border: `1px solid ${T.innerBorder}`, borderRadius: 8, color: T.txtSoft, cursor: "pointer", fontFamily: "inherit", lineHeight: 0, width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease, color ${DUR.micro} ease` }}><Ico n="x" size={12} sw={1.8} /></button>
      </div>
      {notifs.map((n) => (
        <button type="button" key={n.id} onClick={() => markRead(n.id)} style={{ font: "inherit", textAlign: "left", width: "100%",
          padding: "13px 20px", borderBottom: `1px solid ${T.rowBorder}`,
          display: "flex", gap: 12, alignItems: "flex-start", cursor: "pointer",
          background: n.read ? "transparent" : `${typeColor[n.type] || T.primary}07`,
          transition: "background 0.15s" }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: `${typeColor[n.type] || T.primary}14`, border: `1px solid ${typeColor[n.type] || T.primary}2e`, display: "flex", alignItems: "center", justifyContent: "center", color: typeColor[n.type] || T.primary, flexShrink: 0 }}>
            <Ico n={typeIcon[n.type] || "pulse"} size={12.5} sw={1.8} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
              <span style={{ fontSize: 14, fontWeight: n.read ? 520 : 660, color: T.txt }}>{n.title}</span>
              <span style={{ fontSize: 11, color: T.txtSoft, flexShrink: 0 }}>{n.time}</span>
            </div>
            <div style={{ fontSize: 12, color: T.txtMid, marginTop: 3, lineHeight: 1.55 }}>{n.msg}</div>
          </div>
          {!n.read && <div style={{ width: 6, height: 6, borderRadius: "50%", background: typeColor[n.type] || T.primary, flexShrink: 0, marginTop: 6 }} />}
        </button>
      ))}
      <div style={{ padding: "11px 20px", textAlign: "center" }}>
        <button onClick={() => setNotifs(n => n.map(x => ({ ...x, read: true })))} style={{ background: "none", border: "none", fontSize: 12, color: T.txtSoft, cursor: "pointer", fontFamily: "inherit", fontWeight: 500, letterSpacing: 0.3 }}>Mark all as read</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   COMMAND PALETTE (⌘K) - fuzzy nav + quick actions + keyboard
════════════════════════════════════════════════════════════ */
function CommandPalette({ onClose, go }) {
  const { T, mode, flip, toast } = useT();
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  const listRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);

  const pages = NAV.flatMap(n => [
    { type: "page", label: n.label, icon: n.icon, go: () => go(n.id), group: "Navigate" },
    ...n.sub.map(s => ({ type: "sub", label: `${n.label} → ${s.label}`, icon: n.icon, go: () => go(n.id, s.id), group: "Navigate" })),
  ]);
  const kwResults = KEYWORDS.filter(k => k.kw.toLowerCase().includes(q.toLowerCase())).map(k => ({
    type: "keyword", label: k.kw, icon: "search", sub: `Vol ${k.vol.toLocaleString()}, KD ${k.kd}, Pos #${k.pos}`, group: "Keywords", go: () => go("intelligence", "keyword-tracker") }));
  const pgResults = PAGES.filter(p => p.url.toLowerCase().includes(q.toLowerCase())).map(p => ({
    type: "page", label: p.url, icon: "doc", sub: `${p.clicks.toLocaleString()} clicks · pos ${p.pos}`, group: "Pages", go: () => go("intelligence", "page-perf") }));
  const actions = [
    { type: "action", label: mode === "light" ? "Switch to Forest Noir (dark)" : "Switch to Emerald Paper (light)", icon: mode === "light" ? "moon" : "sun", group: "Actions", go: flip, kbd: "⌘⇧D" },
    { type: "action", label: "Mark all notifications read", icon: "check", group: "Actions", go: () => toast("All notifications marked as read", "check") },
    { type: "action", label: "Run daily AI audit now", icon: "radar", group: "Actions", go: () => toast("Daily AI audit queued - results in ~2 min", "radar") },
  ];

  const fuse = (arr) => q.length < 1 ? arr.slice(0, 8) : arr.filter(x =>
    x.label.toLowerCase().includes(q.toLowerCase()) || (x.sub || "").toLowerCase().includes(q.toLowerCase())
  ).slice(0, 8);

  const results = [...fuse(actions), ...fuse(pgResults), ...fuse(kwResults), ...(q.length < 1 ? fuse(pages) : fuse(pages))].slice(0, 12);

  useEffect(() => { setSel(0); }, [q]);
  useEffect(() => {
    const el = listRef.current?.querySelector(`[data-idx="${sel}"]`);
    el?.scrollIntoView({ block: "nearest" });
  }, [sel]);

  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel(s => Math.min(results.length - 1, s + 1)); }
    if (e.key === "ArrowUp") { e.preventDefault(); setSel(s => Math.max(0, s - 1)); }
    if (e.key === "Enter" && results[sel]) { results[sel].go(); onClose(); }
  };

  let lastGroup = null;
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 20, background: T.overlay, display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: "13vh" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} onKeyDown={onKey} style={{
        width: 600, maxWidth: "92vw", background: T.searchBg,
        border: `1px solid ${T.glassBorder}`, borderRadius: 8, overflow: "hidden",
        boxShadow: T.mode === "dark" ? "0 16px 40px rgba(0,0,0,0.40)" : "0 40px 100px -20px rgba(10,10,10,0.30)",
        animation: "popIn 0.24s cubic-bezier(.22,1,.36,1)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "17px 20px", borderBottom: `1px solid ${T.rowBorder}` }}>
          <span style={{ color: T.primary }}><Ico n="search" size={16} sw={1.8} /></span>
          <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search pages, keywords, or type a command…"
            style={{ flex: 1, background: "none", border: "none", outline: "none", fontSize: 14, color: T.txt, fontFamily: "inherit", fontWeight: 500 }} />
          <Kbd>ESC</Kbd>
        </div>
        <div ref={listRef} style={{ maxHeight: 380, overflowY: "auto", padding: "8px" }}>
          {results.map((r, i) => {
            const showGroup = r.group !== lastGroup;
            lastGroup = r.group;
            return (
              <div key={i}>
                {showGroup && <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 2.2, textTransform: "uppercase", color: T.txtSoft, padding: "10px 12px 5px" }}>{r.group}</div>}
                <button type="button" data-idx={i} onClick={() => { r.go(); onClose(); }} onMouseEnter={() => setSel(i)}
                  style={{
                    display: "flex", gap: 12, padding: "10px 12px", alignItems: "center", cursor: "pointer", borderRadius: 8,
                    background: sel === i ? T.activeNav : "transparent",
                    boxShadow: sel === i ? "inset 0 0 0 1px rgba(0,194,122,0.18)" : "none",
                    transition: "background 0.12s" }}>
                  <span style={{
                    width: 28, height: 28, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                    background: sel === i ? `${T.primary}1c` : T.tagBg, color: sel === i ? T.primary : T.txtSoft,
                    border: `1px solid ${sel === i ? `${T.primary}33` : T.innerBorder}` }}><Ico n={r.icon} size={13} sw={1.8} /></span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, color: T.txt, fontWeight: 500, fontFamily: "inherit" }}>{r.label}</div>
                    {r.sub && <div style={{ fontSize: 12, color: T.txtSoft, marginTop: 1 }}>{r.sub}</div>}
                  </div>
                  {sel === i && <Kbd>↵</Kbd>}
                </button>
              </div>
            );
          })}
          {results.length === 0 && (
            <div style={{ padding: "28px", textAlign: "center", color: T.txtSoft, fontSize: 14 }}>
              No results for <span style={{ fontFamily: FONT_SANS, color: T.txt }}>"{q}"</span>
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 16, padding: "10px 20px", borderTop: `1px solid ${T.rowBorder}`, background: T.innerCard }}>
          <span style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12, color: T.txtSoft }}><Kbd>↑↓</Kbd> navigate</span>
          <span style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12, color: T.txtSoft }}><Kbd>↵</Kbd> open</span>
          <span style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12, color: T.txtSoft, marginLeft: "auto" }}>Serpely Command</span>
        </div>
      </div>
    </div>
  );
}

   COMMAND CENTER
══════════════════════════════════════════════ */
/* METRIC SELECTOR
   Google Search Console lets you overlay any metrics by giving each its own
   y-axis. That invents correlations: a percentage sharing an axis with a count
   is pinned flat against it, which is exactly what makes the competitor's
   Key Event Rate line useless. So metrics carry a unit here, metrics that
   share a unit overlay on one axis, and a different unit opens its own chart
   below on the same x-axis. Never two scales on one plot. */
const METRICS = [
  { id: "clicks", label: "Total clicks",     family: "traffic",     unit: "count",   src: "gsc", fmt: (v) => v.toLocaleString() },
  { id: "impr",   label: "Total impressions", family: "impressions", unit: "count",   src: "gsc", fmt: (v) => v.toLocaleString() },
  { id: "ctr",    label: "Average CTR",       family: "engagement",  unit: "percent", src: "gsc", fmt: (v) => v.toFixed(1) + "%" },
  { id: "pos",    label: "Average position",  family: "rankings",    unit: "rank",    src: "gsc", fmt: (v) => v.toFixed(1) },
];

/* Analytics metrics, Command Center only. Search Console stops at the click;
   these two carry on from the landing, so plotting them on the same axis is
   the point: clicks can climb while sessions flatten. */
const METRICS_GA = [
  { id: "sessions", label: "Sessions",   family: "sessions", unit: "count", src: "ga",  fmt: (v) => v.toLocaleString() },
  { id: "users",    label: "New users",  family: "people",   unit: "count", src: "ga",  fmt: (v) => v.toLocaleString() },
  { id: "events",   label: "Key events", family: "outcome",  unit: "count", src: "ga",  fmt: (v) => v.toLocaleString() },
  /* Serpely's own measure. Plotting it against organic clicks is the thing no
     other tool can do: citations can climb while clicks fall, which is what a
     zero-click search result looks like from the inside. */
  { id: "cites",    label: "AI citations", family: "ai",     unit: "count", src: "ai",  fmt: (v) => v.toLocaleString() },
];

/* Secondary encoding. Eight categorical hues cannot all be told apart, which
   the validator confirms: run with --pairs all and both the colourblind and
   the normal-vision floors fail at five slots, let alone eight. So every
   series also carries its own dash pattern, and the legend repeats it.
   Identity never rests on colour. */
const DASH = {
  clicks: null, impr: "7 3", ctr: "2 3", pos: "11 4",
  sessions: "7 3 2 3", users: "1 4", events: "13 3 2 3", cites: "5 2 1 2",
  pages: "7 3 2 3", kws: "7 3" };
const METRICS_ALL = [...METRICS, ...METRICS_GA,
  { id: "pages", label: "Pages with clicks", fmt: (v) => v.toLocaleString() },
  { id: "kws", label: "Ranking keywords", fmt: (v) => v.toLocaleString() }];
const metricById = (id) => METRICS_ALL.find((m) => m.id === id);
const UNIT_LABEL = { count: "Counts", percent: "Rate", rank: "Position" };

function MetricTiles({ selected, onToggle, totals, metrics = METRICS }) {
  const { T } = useT();
  return (
    <div role="group" aria-label="Metrics to plot" className="metric-grid" style={{
      display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))",
      gap: 8, marginBottom: 14 }}>
      {metrics.map((m) => {
        const on = selected.includes(m.id);
        const c = cat(m.family, T);
        const last = selected.length === 1 && on;
        return (
          <button
            key={m.id}
            type="button"
            aria-pressed={on}
            disabled={last}
            title={last ? "Keep at least one metric selected" : undefined}
            onClick={() => onToggle(m.id)}
            style={{
              textAlign: "left", cursor: last ? "not-allowed" : "pointer", font: "inherit",
              background: on ? mixHex(c, T.surface, 0.1) : T.innerCard,
              border: `1px solid ${on ? c : T.innerBorder}`,
              borderTop: `2px solid ${on ? c : "transparent"}`,
              borderRadius: R.md, padding: "9px 12px",
              transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease` }}
          >
            <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
              {/* A tick, not just a colour change, so the on state is never colour alone. */}
              <span aria-hidden="true" style={{
                width: 13, height: 13, borderRadius: 4, flexShrink: 0,
                border: `2px solid ${on ? c : T.txtSoft}`, background: on ? c : "transparent",
                display: "inline-flex", alignItems: "center", justifyContent: "center", color: "#fff" }}>{on && <Ico n="check" size={9} sw={3} />}</span>
              <span style={{ fontSize: FS.micro, color: on ? T.txt : T.txtMid, fontWeight: FW.medium, letterSpacing: 0.4, textTransform: "uppercase", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.label}</span>
            </span>
            <span style={{ display: "block", fontSize: FS.h3, fontWeight: FW.heavy, color: on ? T.txt : T.txtSoft, letterSpacing: -0.6, marginTop: 5, ...NUM }}>
              {totals[m.id]}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ONE plot, always. Search Console changes its axis treatment with how many
   metrics are on, and never splits into separate charts:

     1 selected  one labelled left axis, filled
     2 selected  dual axis, left and right, each labelled with its metric
     3 or 4      axis numbers disappear; series are normalised and overlaid

   The earlier version here stacked a separate chart per metric. That was not
   what GSC does and it was rejected. Dual axis is normally a bad idea because
   two arbitrary scales invent a correlation, so the mitigation is that each
   axis is labelled and coloured to its series, and the tooltip always reports
   real values, including in normalised mode where the axes are gone. */
function MetricPlots({ data, selected, metrics = METRICS }) {
  const { T } = useT();
  const chosen = metrics.filter((m) => selected.includes(m.id));
  const n = chosen.length;

  /* At 3+ there is no honest shared scale, so each series is mapped to its own
     range and the axes come off. Rank is inverted so better reads upward. */
  const plotted = useMemo(() => {
    if (n < 3) return data;
    const ranges = {};
    chosen.forEach((m) => {
      const vals = data.map((d) => d[m.id]).filter((v) => typeof v === "number");
      const lo = Math.min(...vals), hi = Math.max(...vals);
      ranges[m.id] = { lo, hi, span: hi - lo || 1 };
    });
    return data.map((row) => {
      const out = { ...row };
      chosen.forEach((m) => {
        const { lo, span } = ranges[m.id];
        const t = ((row[m.id] ?? lo) - lo) / span;
        out["_n_" + m.id] = m.unit === "rank" ? 1 - t : t;
      });
      return out;
    });
  }, [data, selected.join(","), n]);

  const axisFor = (i) => (i === 0 ? "left" : "right");

  return (
    <div style={{ height: 268 }} role="img"
      aria-label={`${chosen.map((m) => m.label).join(", ")} over the selected period`}>
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={plotted} margin={{ top: 8, right: n === 2 ? 4 : 8, bottom: 0, left: -6 }}>
          <defs>
            {chosen.map((m) => (
              <linearGradient key={m.id} id={`mg-${m.id}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={cat(m.family, T)} stopOpacity={n === 1 ? 0.3 : 0.16} />
                <stop offset="62%" stopColor={cat(m.family, T)} stopOpacity={n === 1 ? 0.08 : 0.04} />
                <stop offset="100%" stopColor={cat(m.family, T)} stopOpacity={0} />
              </linearGradient>
            ))}
          </defs>

          <CartesianGrid vertical={false} stroke={T.chartGrid} strokeDasharray="3 4" />
          <XAxis dataKey="d" tick={{ fontSize: 11, fill: T.txtSoft }} axisLine={false} tickLine={false} minTickGap={32} />

          {n >= 3 ? (
            /* Axis numbers would be meaningless once each line has its own
               scale, so they come off entirely, exactly as GSC does. */
            <YAxis hide domain={[-0.04, 1.04]} />
          ) : (
            chosen.map((m, i) => (
              <YAxis
                key={m.id}
                yAxisId={axisFor(i)}
                orientation={i === 0 ? "left" : "right"}
                tick={{ fontSize: 11, fill: cat(m.family, T) }}
                axisLine={false}
                tickLine={false}
                tickCount={5}
                width={54}
                reversed={m.unit === "rank"}
                tickFormatter={(v) =>
                  m.unit === "percent" ? v + "%" : v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "K" : v}
                /* The axis carries its metric name in that series' colour.
                   An unlabelled dual axis is the thing that misleads. */
                label={{
                  value: m.label,
                  angle: -90,
                  position: i === 0 ? "insideLeft" : "insideRight",
                  style: { fill: cat(m.family, T), fontSize: 11, fontWeight: 700, textAnchor: "middle" } }}
              />
            ))
          )}

          <RTooltip content={<ChartTip />} cursor={{ stroke: T.txtSoft, strokeWidth: 1, strokeDasharray: "3 3" }} />

          {chosen.map((m, i) => (
            <Area
              key={m.id}
              {...(n >= 3 ? {} : { yAxisId: axisFor(i) })}
              dataKey={n >= 3 ? "_n_" + m.id : m.id}
              name={m.label}
              type="monotone"
              stroke={cat(m.family, T)}
              strokeWidth={2.2}
              strokeDasharray={DASH[m.id] || undefined}
              /* Four overlapping fills are unreadable, so 3+ is lines only. */
              fill={n >= 3 ? "none" : `url(#mg-${m.id})`}
              dot={false}
              activeDot={{ r: 4, strokeWidth: 2, stroke: T.surface }}
            />
          ))}
        </AreaChart>
      </ResponsiveContainer>

      {n >= 3 && (
        <div style={{ fontSize: FS.micro, color: T.txtSoft, marginTop: 2 }}>
          Scales differ per metric. Hover for real values.
        </div>
      )}
    </div>
  );
}

/* DATE RANGE
   A real control, not a label. Presets cover the common cases; Custom opens
   two date fields. The chosen range is what every figure on the screen is
   computed from, so changing it changes the data rather than just the text. */
const RANGE_PRESETS = [
  { id: "7d",   label: "Last 7 days",     days: 7 },
  { id: "28d",  label: "Last 28 days",    days: 28 },
  { id: "3mo",  label: "Last 3 months",   days: 90 },
  { id: "6mo",  label: "Last 6 months",   days: 180 },
  { id: "12mo", label: "Last 12 months",  days: 365 },
];

/* The demo has a fixed "today" so figures stay stable between reloads. */
const TODAY = new Date(2026, 2, 4);

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const toISO = (d) => d.toISOString().slice(0, 10);
const fromISO = (v) => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDay = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtRange = (from, to) =>
  from.getFullYear() === to.getFullYear()
    ? `${fmtDay(from)} - ${fmtDay(to)}, ${to.getFullYear()}`
    : `${fmtDay(from)}, ${from.getFullYear()} - ${fmtDay(to)}, ${to.getFullYear()}`;

function useDateRange(initial = "28d") {
  const preset = RANGE_PRESETS.find((p) => p.id === initial) || RANGE_PRESETS[1];
  const [range, setRange] = useState({
    id: preset.id,
    from: addDays(TODAY, -(preset.days - 1)),
    to: TODAY });
  const days = Math.max(1, Math.round((range.to - range.from) / 86400000) + 1);
  return [range, setRange, days];
}

function DateRange({ value, onChange }) {
  const { T } = useT();
  const [open, setOpen] = useState(false);
  const [draftFrom, setDraftFrom] = useState(toISO(value.from));
  const [draftTo, setDraftTo] = useState(toISO(value.to));
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [open]);

  const pick = (p) => {
    onChange({ id: p.id, from: addDays(TODAY, -(p.days - 1)), to: TODAY });
    setOpen(false);
  };

  const applyCustom = () => {
    const f = fromISO(draftFrom), t = fromISO(draftTo);
    if (!draftFrom || !draftTo || f > t) return;
    onChange({ id: "custom", from: f, to: t });
    setOpen(false);
  };

  const invalid = draftFrom && draftTo && fromISO(draftFrom) > fromISO(draftTo);

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button
        type="button"
        aria-haspopup="dialog"
        aria-expanded={open}
        onClick={() => setOpen((o) => !o)}
        style={{
          display: "inline-flex", alignItems: "center", gap: 8, cursor: "pointer",
          color: T.txtMid, fontSize: FS.small, padding: "8px 12px",
          background: open ? T.innerCard : T.btnGhost,
          border: `1px solid ${open ? T.primary : T.btnGhostBorder}`,
          borderRadius: R.md, fontWeight: FW.bold, minHeight: 34,
          transition: `background ${DUR.micro} ease, border-color ${DUR.micro} ease` }}
      >

/* One generator so every screen reading a range produces a consistent series:
   denser points for short windows, monthly-ish points for long ones. */
function seriesForRange(days, seed = 1) {
  const pts = days <= 7 ? days : days <= 28 ? 14 : days <= 90 ? 18 : 24;
  const step = days / pts;
  return Array.from({ length: pts }, (_, i) => {
    const d = addDays(TODAY, -Math.round((pts - 1 - i) * step));
    const wave = Math.sin((i / pts) * Math.PI * 2.2 + seed) * 0.22;
    const growth = 0.55 + (i / pts) * 0.45;
    const clicks = Math.max(1, Math.round(23 * growth * (1 + wave)));
    const impr = Math.round(clicks * (46 + (i % 5) * 3));
    /* Sessions run ahead of organic clicks because direct and referral land
       here too; new users track sessions but lag on the return visits. */
    const sessions = Math.round(clicks * (1.9 + wave * 0.5) + 288);
    const users = Math.round(sessions * (0.72 - (i / pts) * 0.06));
    const events = Math.round(sessions * (1.6 + (i / pts) * 0.35));
    /* Citations rise faster than clicks: more answers cite the site, fewer
       people click through to it. */
    const cites = Math.round(85 + (i / pts) * 55 + wave * 9);
    return {
      d: days > 90 ? d.toLocaleDateString("en-US", { month: "short", year: "2-digit" }) : fmtDay(d),
      clicks,
      impr,
      ctr: +((clicks / impr) * 100).toFixed(2),
      pos: +(38.4 - (i / pts) * 9.6 + (i % 3) * 0.8).toFixed(1),
      sessions,
      users,
      events,
      cites };
  });
}

/* Paginated table. The build had none, so every table showed its first few
   rows and silently dropped the rest, which is why the data looked thin. */
function DataTable({ cols, rows, render, pageSize = 10, caption, minWidth = 640 }) {
  const { T } = useT();
  const [page, setPage] = useState(0);
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  const p = Math.min(page, pages - 1);
  const slice = rows.slice(p * pageSize, p * pageSize + pageSize);
  const from = rows.length === 0 ? 0 : p * pageSize + 1;
  const to = Math.min(rows.length, (p + 1) * pageSize);

  if (rows.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "36px 20px" }}>
        <span aria-hidden="true" style={{ color: T.txtSoft, display: "inline-flex", marginBottom: 10 }}>
          <Ico n="search" size={22} sw={1.6} />
        </span>
        <div style={{ fontSize: FS.body, color: T.txt, fontWeight: FW.bold }}>Nothing here for this period</div>
        <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: 4 }}>Try a wider date range.</div>
      </div>
    );
  }

  return (
    <>
      <div className="tbl-scroll">
        <table style={{ width: "100%", minWidth, borderCollapse: "collapse", fontSize: 14 }}>
          {caption && <caption style={{ captionSide: "top", textAlign: "left", padding: 0, height: 0, overflow: "hidden", position: "absolute", clip: "rect(0 0 0 0)" }}>{caption}</caption>}
          <TableHead cols={cols} />
          <tbody>
            {slice.map((r, i) => (
              <tr key={i} className="tbl-row" style={{ borderBottom: `1px solid ${T.rowBorder}` }}>
                {render(r)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginTop: 10, flexWrap: "wrap" }}>
        <span style={{ fontSize: FS.small, color: T.txtSoft, ...NUM }}>
          {from}-{to} of {rows.length.toLocaleString()}
        </span>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <Btn disabled={p === 0} onClick={() => setPage(p - 1)} style={{ fontSize: FS.small }}>Prev</Btn>
          <span style={{ fontSize: FS.small, color: T.txtMid, ...NUM, padding: "0 4px" }}>{p + 1} / {pages}</span>
          <Btn disabled={p >= pages - 1} onClick={() => setPage(p + 1)} style={{ fontSize: FS.small }}>Next</Btn>
        </div>
      </div>
    </>
  );
}

/* A country always renders with its flag, so the eye finds the row before it
   reads the name. "Other" has no ISO code and takes the globe instead. */
function CountryCell({ iso, name }) {
  const { T } = useT();
  const src = flagSrc(iso);
  /* The ISO code sits in the box underneath and the flag is laid over the top
     of it. If the image never arrives - no network, or the file opened from a
     USB stick - the image is simply removed and the code is already there. */
  const [failed, setFailed] = useState(false);

/* The derived view. GA4 ships these two reports side by side and never
   subtracts them, so the question "which channels acquire versus which bring
   people back" is left to the reader. Sessions per acquired user answers it:
   near 1 means one visit and gone, high means the channel is a return path. */
function acqRole(r) {
  const spu = r.firstUsers > 0 ? r.sessions / r.firstUsers : Infinity;
  if (r.firstUsers === 0 || spu >= 6) return { key: "return", label: "Return path", spu, family: "engagement" };
  if (spu >= 1.8) return { key: "both", label: "Both", spu, family: "impressions" };
  return { key: "acquire", label: "Acquires", spu, family: "traffic" };
}

/* Key events per organic click. A page can rank well, earn clicks, and still
   produce nothing; another can earn three clicks and drive the business.
   Ranking is the input, this is the output. */
function pageVerdict(r) {
  if (r.impr >= 60 && r.clicks === 0) return { key: "wasted", label: "Ranking, no clicks", family: "rankings" };
  if (r.clicks > 0 && r.avgTime < 10 && r.keyEvents <= 5) return { key: "hollow", label: "Clicks, no engagement", family: "engagement" };
  if (r.clicks > 0 && r.keyEvents / r.clicks >= 10) return { key: "earner", label: "High value per click", family: "traffic" };
  if (r.clicks > 0) return { key: "ok", label: "Converting", family: "impressions" };
  return { key: "idle", label: "No data yet", family: "ai" };
}

function RetentionPanel() {
  const { T } = useT();
  const newUsers = 858, returning = 128;
  const returnRate = (returning / (newUsers + returning)) * 100;

  /* Week 1 across mature cohorts is the number that matters: it says whether
     anyone came back at all after the first visit. */
  const wk1 = COHORTS.filter((c) => c.weeks.length > 1).map((c) => c.weeks[1]);
  const avgWk1 = wk1.reduce((a, b) => a + b, 0) / wk1.length;
  const trend = wk1[wk1.length - 1] - wk1[0];

  const cellTone = (v) => {
    if (v == null) return null;
    if (v >= 100) return 1;
    return Math.min(1, v / 5);
  };

  return (
    <Glass style={{ marginBottom: 16 }}>
      <div style={{ marginBottom: 12 }}>
        <Lbl color={T.primary}>Retention and funnel</Lbl>
        <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: -6 }}>
          Whether the traffic comes back, and how far it gets when it does.
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))", gap: 12, marginBottom: 16 }}>
        <div style={{ background: catFace("engagement", T), border: `1px solid ${T.glassBorder}`, borderLeft: `2px solid ${cat("engagement", T)}`, borderRadius: R.md, padding: "14px 16px" }}>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6 }}>Returning share</div>
          <div style={{ fontSize: FS.h3, fontWeight: FW.heavy, color: T.txt, ...NUM }}>{returnRate.toFixed(1)}%</div>
          <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 4 }}>
            {returning} returning against {newUsers.toLocaleString()} new.
          </div>
        </div>
        <div style={{ background: catFace("rankings", T), border: `1px solid ${T.glassBorder}`, borderLeft: `2px solid ${cat("rankings", T)}`, borderRadius: R.md, padding: "14px 16px" }}>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6 }}>Week one retention</div>
          <div style={{ fontSize: FS.h3, fontWeight: FW.heavy, color: T.txt, ...NUM }}>{avgWk1.toFixed(1)}%</div>
          <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 4 }}>
            averaged across cohorts, {trend >= 0 ? "improving" : "declining"} by {Math.abs(trend).toFixed(1)} points.
          </div>
        </div>
        <div style={{ background: catFace("ai", T), border: `1px solid ${T.glassBorder}`, borderLeft: `2px solid ${cat("ai", T)}`, borderRadius: R.md, padding: "14px 16px" }}>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6 }}>Signup to pricing</div>
          <div style={{ fontSize: FS.h3, fontWeight: FW.heavy, color: T.txt, ...NUM }}>
            {((FUNNEL[3].users / FUNNEL[2].users) * 100).toFixed(0)}%
          </div>
          <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 4 }}>
            of people who signed up went on to view pricing.
          </div>
        </div>
      </div>

      <div className="split-16" style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 16 }}>
        <div>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 8 }}>Weekly cohorts</div>
          <div className="tbl-scroll">
            <table style={{ width: "100%", minWidth: 460, borderCollapse: "collapse", fontSize: 14 }}>
              <caption style={{ position: "absolute", clip: "rect(0 0 0 0)" }}>Share of each weekly cohort still active in later weeks</caption>
              <thead>
                <tr style={{ borderBottom: `1px solid ${T.innerBorder}` }}>
                  <th scope="col" style={{ textAlign: "left", padding: "8px 10px", fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, fontWeight: FW.medium }}>Cohort</th>
                  {["W0", "W1", "W2", "W3", "W4", "W5"].map((w) => (
                    <th key={w} scope="col" style={{ textAlign: "center", padding: "8px 6px", fontSize: FS.micro, color: T.txtSoft, fontWeight: FW.medium }}>{w}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {COHORTS.map((c) => (
                  <tr key={c.label}>
                    <td style={{ padding: "6px 10px", fontSize: FS.small, color: T.txtMid, whiteSpace: "nowrap" }}>{c.label}</td>
                    {Array.from({ length: 6 }, (_, i) => {
                      const v = c.weeks[i];
                      const t = cellTone(v);
                      return (
                        <td key={i} style={{ padding: 3, textAlign: "center" }}>
                          {v == null ? (
                            <span style={{ display: "block", height: 26 }} />
                          ) : (
                            /* The number is printed in every cell, so the grid
                               never relies on shade alone to be read. */
                            <span style={{
                              display: "block", height: 26, lineHeight: "26px", borderRadius: R.sm,
                              background: mixHex(cat("impressions", T), T.surface, 0.08 + t * 0.62),
                              color: t > 0.55 ? "#ffffff" : T.txt,
                              fontSize: FS.micro, fontWeight: FW.bold, ...NUM }}>{v >= 100 ? "100" : v.toFixed(1)}</span>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 8 }}>Funnel</div>
          <div style={{ display: "grid", gap: 7 }}>
            {FUNNEL.map((f, i) => {
              const pct = (f.users / FUNNEL[0].users) * 100;
              const drop = i > 0 ? 100 - (f.users / FUNNEL[i - 1].users) * 100 : 0;
              return (
                <div key={f.stage}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 3 }}>
                    <span style={{ fontSize: FS.small, color: T.txt, fontWeight: FW.medium }}>{f.stage}</span>
                    <span style={{ fontSize: FS.small, color: T.txt, fontWeight: FW.bold, ...NUM }}>{f.users.toLocaleString()}</span>
                  </div>
                  <Bar val={pct} max={100} height={6} grad={cat(f.family, T)} />
                  {i > 0 && (
                    <div style={{ fontSize: FS.micro, color: T.txtSoft, marginTop: 2, ...NUM }}>
                      {drop.toFixed(0)}% drop from previous step
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </Glass>
  );
}

function PageValuePanel() {
  const { T } = useT();
  const [sort, setSort] = useState("value");

  const rows = useMemo(() => {
    const mapped = PAGE_VALUE.map((r) => ({
      ...r,
      perClick: r.clicks > 0 ? r.keyEvents / r.clicks : 0,
      verdict: pageVerdict(r) }));
    if (sort === "value") return [...mapped].sort((a, b) => b.perClick - a.perClick || b.keyEvents - a.keyEvents);
    if (sort === "wasted") return [...mapped].sort((a, b) => (b.clicks === 0 ? b.impr : -1) - (a.clicks === 0 ? a.impr : -1));
    return [...mapped].sort((a, b) => b.impr - a.impr);
  }, [sort]);

  const wasted = PAGE_VALUE.filter((r) => r.impr >= 60 && r.clicks === 0);
  const wastedImpr = wasted.reduce((a, r) => a + r.impr, 0);
  const hollow = PAGE_VALUE.filter((r) => r.clicks > 0 && r.avgTime < 10 && r.keyEvents <= 5);
  const best = [...PAGE_VALUE].filter((r) => r.clicks > 0)
    .sort((a, b) => (b.keyEvents / b.clicks) - (a.keyEvents / a.clicks))[0];

  const fmtTime = (s) => (s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s");

  return (
    <Glass style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <div>
          <Lbl color={T.primary}>Page value</Lbl>
          <div style={{ fontSize: FS.small, color: T.txtSoft, marginTop: -6 }}>
            Search Console and Analytics on the same row. Ranking is the input, engagement is the output.
          </div>
        </div>
        <Segmented
          ariaLabel="Sort page value"
          value={sort}
          onChange={setSort}
          options={[
            { value: "value", label: "Most valuable" },
            { value: "wasted", label: "Wasted rankings" },
            { value: "impr", label: "Most impressions" },
          ]}
        />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 12, marginBottom: 14 }}>
        <div style={{ background: catFace("rankings", T), border: `1px solid ${T.glassBorder}`, borderLeft: `2px solid ${cat("rankings", T)}`, borderRadius: R.md, padding: "14px 16px" }}>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6 }}>Wasted rankings</div>
          <div style={{ fontSize: FS.h3, fontWeight: FW.heavy, color: T.txt, ...NUM }}>{wastedImpr.toLocaleString()}</div>
          <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 4 }}>
            impressions across {wasted.length} pages earning zero clicks.
          </div>
        </div>
        <div style={{ background: catFace("engagement", T), border: `1px solid ${T.glassBorder}`, borderLeft: `2px solid ${cat("engagement", T)}`, borderRadius: R.md, padding: "14px 16px" }}>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6 }}>Clicks that bounce</div>
          <div style={{ fontSize: FS.h3, fontWeight: FW.heavy, color: T.txt, ...NUM }}>{hollow.length}</div>
          <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 4 }}>
            pages win the click, then lose the visitor inside ten seconds.
          </div>
        </div>
        <div style={{ background: catFace("traffic", T), border: `1px solid ${T.glassBorder}`, borderLeft: `2px solid ${cat("traffic", T)}`, borderRadius: R.md, padding: "14px 16px" }}>
          <div style={{ fontSize: FS.micro, color: T.txtSoft, textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6 }}>Best value per click</div>
          <div style={{ fontSize: FS.body, fontWeight: FW.bold, color: T.txt, fontFamily: FONT_SANS, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{best ? best.url : "-"}</div>
          <div style={{ fontSize: FS.small, color: T.txtMid, marginTop: 4 }}>
            {best ? `${Math.round(best.keyEvents / best.clicks)} key events per click on ${best.clicks} clicks.` : ""}
          </div>
        </div>
      </div>

      <DataTable
        caption="Landing pages with Search Console and Analytics metrics joined"
        cols={["Page", "Impr.", "Clicks", "Pos.", "Avg. time", "Key events", "Per click", "Verdict"]}
        rows={rows}
        pageSize={10}
        render={(r) => {
          const c = cat(r.verdict.family, T);
          return (<>
            <td style={{ padding: "10px 14px", color: cat("impressions", T), fontFamily: FONT_SANS, fontSize: FS.small, maxWidth: 260, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.url}</td>
            <td style={{ padding: "10px 14px", color: T.txtMid, ...NUM }}>{r.impr.toLocaleString()}</td>
            <td style={{ padding: "10px 14px", color: T.txt, fontWeight: FW.bold, ...NUM }}>{r.clicks}</td>
            <td style={{ padding: "10px 14px", color: T.txtMid, ...NUM }}>{r.pos.toFixed(1)}</td>
            {/* Engagement time is the tell: a 2s visit means the click was wasted. */}
            <td style={{ padding: "10px 14px", color: r.avgTime === 0 ? T.txtSoft : r.avgTime < 10 ? T.bad : T.txtMid, ...NUM }}>{fmtTime(r.avgTime)}</td>
            <td style={{ padding: "10px 14px", color: T.txt, fontWeight: FW.medium, ...NUM }}>{r.keyEvents.toLocaleString()}</td>
            <td style={{ padding: "10px 14px", ...NUM }}>
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ width: 44, flexShrink: 0 }}>
                  <Bar val={Math.min(r.perClick, 60)} max={60} height={4} grad={c} />
                </span>
                <span style={{ color: T.txtMid }}>{r.clicks > 0 ? r.perClick.toFixed(0) : "-"}</span>
              </span>
            </td>
            <td style={{ padding: "10px 14px" }}><Tag color={c}>{r.verdict.label}</Tag></td>
          </>);
        }}
      />
    </Glass>
  );
}

function AcquisitionPanel() {
  const { T } = useT();
  const [view, setView] = useState("compare");

  const totUsers = ACQ_SOURCES.reduce((a, r) => a + r.firstUsers, 0);
  const totSess = ACQ_SOURCES.reduce((a, r) => a + r.sessions, 0);

  const rows = useMemo(() => {
    const withRole = ACQ_SOURCES.map((r) => {
      const role = acqRole(r);
      return {
        ...r,
        label: r.med ? `${r.src} / ${r.med}` : r.src,
        acqShare: (r.firstUsers / totUsers) * 100,
        sesShare: (r.sessions / totSess) * 100,
        role };
    });
    const key = view === "users" ? "firstUsers" : "sessions";
    return [...withRole].sort((a, b) => b[key] - a[key]);

  /* The headline the comparison exists to produce. */

/* Site-wide monthly totals for the summary chart. Built from the table so the
   last month always equals what the table adds up to. AI citations only start
   partway through: that is when assistants began citing the site at all. */
const SITE_TOTALS = {
  clicks: SITE_PAGES.reduce((a, p) => a + p.clicks, 0),
  pages: SITE_PAGES.filter((p) => p.clicks > 0).length,
  kws: SITE_PAGES.reduce((a, p) => a + perfOf(p.url).kws, 0),
  cites: SITE_PAGES.reduce((a, p) => a + perfOf(p.url).cites, 0) };
const MONTH_ABBR = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const SITE_TREND = (() => {
  const n = 36, out = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - (n - 1 - i), 1);
    const t = i / (n - 1);
    const last = i === n - 1;
    const wob = last ? 1 : 1 + 0.07 * Math.sin(i * 1.7) + 0.03 * Math.cos(i * 0.9);
    const ai = t < 0.42 ? 0 : Math.pow((t - 0.42) / 0.58, 2.2);
    out.push({
      d: `${MONTH_ABBR[d.getMonth()]} ’${String(d.getFullYear()).slice(2)}`,
      clicks: Math.round(SITE_TOTALS.clicks * (0.06 + 0.94 * Math.pow(t, 2.1)) * wob),
      pages: Math.max(1, Math.round(1 + (SITE_TOTALS.pages - 1) * Math.pow(t, 1.5) * (last ? 1 : wob))),
      kws: Math.round(SITE_TOTALS.kws * (0.12 + 0.88 * Math.pow(t, 1.6)) * wob),
      cites: Math.round(SITE_TOTALS.cites * ai * (last ? 1 : wob)) });
  }
  return out;
})();
